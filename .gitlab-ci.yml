stages:
  - test
  - deploy

test:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm test || echo "no tests yet, skipping"

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -X POST "$FRONTEND_RENDER_DEPLOY_HOOK"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual