name: Frontend Pipeline & Deployment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:

  # -------------------------
  # 1. TEST
  # -------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || echo "No tests yet, skipping"

  # -------------------------
  # 2. BUILD
  # -------------------------
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

  # -------------------------
  # 3. DEPLOY TO OFFICE SERVER (Dev / QA)
  # -------------------------
  deploy-office-server:
    name: "Deploy to Office Server (${{ inputs.target_env }})"
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.target_env == 'dev' || inputs.target_env == 'qa' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            TARGET="${{ inputs.target_env }}"

            echo "==============================================="
            echo " Deploying Frontend"
            echo " Branch : $BRANCH"
            echo " Target : $TARGET"
            echo "==============================================="

            cd /home/mitrahsoft_main_server/db_nexus/SchemaFlow-FrontEnd
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            cd /home/mitrahsoft_main_server/db_nexus

            if [ "$TARGET" = "qa" ]; then
              docker compose up -d --build frontend-qa
            else
              docker compose up -d --build frontend-dev
            fi

            echo ""
            echo "Container Status:"
            docker compose ps

  # -------------------------
  # 4. DEPLOY TO RAILWAY (Production)
  # -------------------------
  deploy-production:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.target_env == 'prod' }}

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SECRET_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Deploying frontend to Railway PRODUCTION..."
          railway up \
            --service "DB Nexus-Frontend" \
            --ci
