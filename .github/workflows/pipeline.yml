name: Frontend Pipeline

on:
  push:
    branches:
      - main
      - release
      - dev

jobs:

  # -------------------------
  # 1. TEST
  # -------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || echo "No tests yet, skipping"


  # -------------------------
  # 2. BUILD
  # -------------------------
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build


  # -------------------------
  # 3. DEPLOY TO DEV
  # -------------------------
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: DEV

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to Dev
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SECRET_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Deploying frontend to Railway DEV..."
          railway --version || true
          railway whoami || true
          railway status || true
          echo "Starting deploy..."
          railway up \
            --service "DB Nexus-frontend" \
            --ci


  # -------------------------
  # 4. DEPLOY TO UAT
  # -------------------------
  deploy-uat:
    runs-on: ubuntu-latest
    needs: deploy-dev

    environment:
      name: QA

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to UAT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SECRET_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Deploying frontend to Railway UAT..."

          railway up \
            --service "DB Nexus-frontend" \
            --ci


  # -------------------------
  # 5. DEPLOY TO PRODUCTION
  # -------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-uat

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SECRET_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Deploying frontend to Railway PRODUCTION..."

          railway up \
            --service "DB Nexus-frontend" \
            --ci
