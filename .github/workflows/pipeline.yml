name: Frontend Pipeline

on:
  push:
    branches:
      - main
      - release
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test || echo "no tests yet, skipping"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    env:
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: |
          echo "Deploying Angular SSR frontend to Railway..."
          ENVIRONMENT_NAME="${{ github.ref_name == 'main' && 'production' || github.ref_name }}"
          railway up --service "DB Nexus-frontend" --environment $ENVIRONMENT_NAME --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
