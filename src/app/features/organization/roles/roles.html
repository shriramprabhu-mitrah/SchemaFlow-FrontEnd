<div class="admin-page">
  <div class="page-header">
    <div>
      <h1>Roles & Permissions</h1>
      <p class="text-muted page-subtitle">Configure role-based access control and inspect defined organization roles.</p>
    </div>
  </div>
  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <span>Loading roles...</span>
  </div>

  <h3 class="section-subtitle section-subtitle-margin" *ngIf="!loading">Defined Roles</h3>
  <div class="data-table-wrap table-wrap-margin" *ngIf="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>ROLE NAME</th>
          <th>SLUG</th>

        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of roles">
          <td><strong>{{ r.name }}</strong></td>
          <td><code>{{ r.slug }}</code></td>

        </tr>
      </tbody>
    </table>
    <div class="empty-state" *ngIf="roles.length === 0">No roles configured</div>
  </div>

</div>
