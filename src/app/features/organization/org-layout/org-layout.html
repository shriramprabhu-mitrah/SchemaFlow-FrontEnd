<div class="org-shell" [class.collapsed]="sidebarCollapsed">
  <!-- Sidebar -->
  <aside class="org-sidebar">
    <div class="sidebar-header sidebar-header-flex">
      <!-- Logo and brand text always centered inside header -->
      <a routerLink="/" class="brand-mark tt brand-link-flex" [class.tt-bottom]="!sidebarCollapsed"
        [class.tt-right]="sidebarCollapsed" data-tt="Go to Home">
        <app-icons name="db-diagram-logo" size="32" class="brand-icon-wrap"></app-icons>
        <span class="brand-text brand-text-flex" *ngIf="!sidebarCollapsed">DB Nexus</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/organization/dashboard" routerLinkActive="active" class="nav-item" [class.tt]="sidebarCollapsed"
        [class.tt-right]="sidebarCollapsed" [attr.data-tt]="sidebarCollapsed ? 'Dashboard' : null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Dashboard</span>
      </a>

      <a routerLink="/organization/settings" routerLinkActive="active" class="nav-item" [class.tt]="sidebarCollapsed"
        [class.tt-right]="sidebarCollapsed" [attr.data-tt]="sidebarCollapsed ? 'General Settings' : null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">General</span>
      </a>

      <a *ngIf="isOwner" routerLink="/organization/subscription" routerLinkActive="active" class="nav-item"
        [class.tt]="sidebarCollapsed" [class.tt-right]="sidebarCollapsed"
        [attr.data-tt]="sidebarCollapsed ? 'Subscription' : null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <rect x="1" y="4" width="22" height="16" rx="2" />
          <line x1="1" y1="10" x2="23" y2="10" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Subscription</span>
      </a>

      <a routerLink="/organization/members" routerLinkActive="active" class="nav-item" [class.tt]="sidebarCollapsed"
        [class.tt-right]="sidebarCollapsed" [attr.data-tt]="sidebarCollapsed ? 'Members' : null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Members</span>
      </a>

      <a routerLink="/organization/audit-logs" routerLinkActive="active" class="nav-item" [class.tt]="sidebarCollapsed"
        [class.tt-right]="sidebarCollapsed" [attr.data-tt]="sidebarCollapsed ? 'Audit Logs' : null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Audit Logs</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item footer-action" (click)="goBack()" [class.tt]="sidebarCollapsed"
        [class.tt-right]="sidebarCollapsed" [attr.data-tt]="sidebarCollapsed ? 'Back to application' : null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Go to Application</span>
      </button>
      <button class="nav-item footer-action logout" (click)="logout()" [class.tt]="sidebarCollapsed"
        [class.tt-right]="sidebarCollapsed" [attr.data-tt]="sidebarCollapsed ? 'Logout' : null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="org-main">
    <header class="org-top-header">
      <div class="header-left header-left-flex">
        <button class="theme-toggle-btn tt tt-bottom toggle-sidebar-btn" data-tt="Toggle Sidebar"
          (click)="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>
      <div class="header-right">
        <button class="theme-toggle-btn tt tt-bottom" (click)="dashService.toggleTheme()"
          [attr.data-tt]="dashService.theme() === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
          <svg *ngIf="dashService.theme() === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg *ngIf="dashService.theme() === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
        <span class="user-email-chip" *ngIf="userEmail">
          <span class="avatar-mini">{{ userInitial }}</span>
          <span>{{ userEmail }}</span>
        </span>
      </div>
    </header>
    <div class="org-content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Global Organization Toaster Component -->
  <app-toast></app-toast>
</div>
