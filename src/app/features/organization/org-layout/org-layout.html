<div class="org-shell" [class.collapsed]="sidebarCollapsed">
  <!-- Sidebar -->
  <aside class="org-sidebar">
    <div class="sidebar-header">
      <!-- When collapsed: click logo to expand sidebar -->
      <div *ngIf="sidebarCollapsed" class="brand-mark" (click)="toggleSidebar()" title="Expand Sidebar"
        style="cursor:pointer">
        <app-icons name="db-diagram-logo" size="32"></app-icons>
      </div>

      <!-- When expanded: click logo/text to navigate to landing page -->
      <a *ngIf="!sidebarCollapsed" routerLink="/" class="brand-mark" title="Go to Home"
        style="text-decoration:none;cursor:pointer">
        <app-icons name="db-diagram-logo" size="32"></app-icons>
        <span class="brand-text">MS Dbdiagram</span>
      </a>
      <button class="collapse-btn" *ngIf="!sidebarCollapsed" (click)="toggleSidebar()" title="Collapse Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <line x1="17" y1="12" x2="7" y2="12" />
          <polyline points="11 8 7 12 11 16" />
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/organization/settings" routerLinkActive="active" class="nav-item"
        [title]="sidebarCollapsed ? 'General Settings' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">General</span>
      </a>

      <a *ngIf="isOwner" routerLink="/organization/subscription" routerLinkActive="active" class="nav-item"
        [title]="sidebarCollapsed ? 'Subscription' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <rect x="1" y="4" width="22" height="16" rx="2" />
          <line x1="1" y1="10" x2="23" y2="10" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Subscription</span>
      </a>

      <a routerLink="/organization/members" routerLinkActive="active" class="nav-item"
        [title]="sidebarCollapsed ? 'Members' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Members</span>
      </a>

      <a routerLink="/organization/roles" routerLinkActive="active" class="nav-item"
        [title]="sidebarCollapsed ? 'Roles' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Roles</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item footer-action" (click)="goBack()" [title]="sidebarCollapsed ? 'Back to application' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Go to application</span>
      </button>
      <button class="nav-item footer-action logout" (click)="logout()" [title]="sidebarCollapsed ? 'Logout' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="org-main">
    <header class="org-top-header">
      <div class="header-left">
        <h2 class="page-title">Organization Dashboard</h2>
      </div>
      <div class="header-right">
        <button class="theme-toggle-btn" (click)="dashService.toggleTheme()"
          [title]="dashService.theme() === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
          <svg *ngIf="dashService.theme() === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg *ngIf="dashService.theme() === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
        <span class="user-email-chip" *ngIf="userEmail">
          <span class="avatar-mini">{{ userInitial }}</span>
          <span>{{ userEmail }}</span>
        </span>
      </div>
    </header>
    <div class="org-content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Global Organization Toaster Component -->
  <app-toast></app-toast>
</div>
