<aside class="activity-sidebar" [class.light]="svc.theme() === 'light'">
  <!-- Top section -->
  <div class="activity-top-group">
    <!-- Import Button -->
    <div class="activity-nav-item import-item tt tt-right" *ngIf="!isCanViewOnly" [class.active]="importMenuOpen"
      [class.disabled]="!isLoggedIn || isSampleDiagram() || isMemberRestricted(['import_sql'])" (click)="toggleImportMenu($event)"
      [attr.data-tt]="isMemberRestricted(['import_sql']) || importMenuOpen ? null : (!isLoggedIn ? 'Sign in to import SQL' : (isSampleDiagram() ? 'Import is disabled for sample diagrams' : 'Import from SQL'))"
      aria-label="Import from SQL">
      <div class="sidebar-crown-badge" *ngIf="showCrown('import')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
      </div>
      <span class="nav-label">Import</span>

      <!-- Import Flyout Menu -->
      <div class="sidebar-flyout-menu" *ngIf="importMenuOpen">
        <div class="flyout-header">Import from SQL</div>

        <button class="flyout-item" (click)="openImportDialect('postgres', $event)"
          [disabled]="entitlementService.orgHasFeature('import_sql') && !entitlementService.hasMemberAccess('import_sql')">
          <span class="db-icon postgres-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z" />
            </svg>
          </span>
          <span class="item-name">PostgreSQL</span>
          
        </button>

        <button class="flyout-item" (click)="openImportDialect('mysql', $event)"
          [disabled]="entitlementService.orgHasFeature('import_sql') && !entitlementService.hasMemberAccess('import_sql')">
          <span class="db-icon mysql-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c.83 0 1.5.67 1.5 1.5S12.83 8 12 8s-1.5-.67-1.5-1.5S11.17 5 12 5zm0 14c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08C16.71 17.72 14.5 19 12 19z" />
            </svg>
          </span>
          <span class="item-name">MySQL</span>
          
        </button>

        <button class="flyout-item" (click)="openImportDialect('mariadb', $event)"
          [disabled]="entitlementService.orgHasFeature('import_sql') && !entitlementService.canUseFeature('import_sql')">
          <span class="db-icon mariadb-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm4 0h-2v-4h2v4zm-2-8a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 13 9zm-4 0a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 9 9z" />
            </svg>
          </span>
          <span class="item-name">MariaDB</span>
          <app-icons *ngIf="isLoggedIn && !entitlementService.orgHasFeature('import_sql')" name="premium-crown"
            size="14" color="#f59e0b" style="margin-left: auto;"></app-icons>
        </button>

        <button class="flyout-item" (click)="openImportDialect('sqlserver', $event)"
          [disabled]="entitlementService.orgHasFeature('import_sql') && !entitlementService.hasMemberAccess('import_sql')">
          <span class="db-icon mssql-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
            </svg>
          </span>
          <span class="item-name">SQL Server</span>
          
        </button>

        <!-- SQLite -->
        <button class="flyout-item export-item" id="import-sqlite-btn"
          (click)="openImportModal('sqlite')"
          [disabled]="importing || !entitlementService.hasMemberAccess('import_sql')">
          <span class="db-icon sqlite-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" />
            </svg>
          </span>
          <span class="item-name">SQLite</span>
          
        </button>

        <!-- MongoDB (NoSQL) -->
        <button class="flyout-item" id="import-mongodb-btn"
          (click)="openImportDialect('mongodb', $event)"
          [disabled]="importing || !entitlementService.hasMemberAccess('import_sql')">
          <span class="db-icon mongodb-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C11.5 4.5 9 8 9 12c0 3.5 2 6.5 3 8 1-1.5 3-4.5 3-8 0-4-2.5-7.5-3-10z" />
            </svg>
          </span>
          <span class="item-name">MongoDB (NoSQL)</span>
        </button>
      
      </div>
    </div>
    

    <!-- Export Button -->
    <div class="activity-nav-item export-item-wrap tt-right"
      [class.tt]="!exportMenuOpen && !hasDbmlErrors()"
      [class.active]="exportMenuOpen"
      [class.disabled]="!isLoggedIn || isSampleDiagram() || isMemberRestricted(['export_image', 'export_sql'])" (click)="toggleExportMenu($event)"
      [attr.data-tt]="isMemberRestricted(['export_image', 'export_sql']) || exportMenuOpen || hasDbmlErrors() ? null : (!isLoggedIn ? 'Sign in to export diagram or SQL' : (isSampleDiagram() ? 'Export is disabled for sample diagrams' : 'Export diagram or SQL'))"
      aria-label="Export diagram or SQL">
      <div class="sidebar-crown-badge" *ngIf="showCrown('export')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 5 17 10" />
          <line x1="12" y1="5" x2="12" y2="15" />
        </svg>
      </div>
      <span class="nav-label">Export</span>

      <!-- Export Flyout Menu -->
      <div class="sidebar-flyout-menu export-flyout" *ngIf="exportMenuOpen">
        <div class="flyout-header">Export as diagram</div>

        <button class="flyout-item" (click)="exportFormat('pdf', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || !entitlementService.hasMemberAccess('export_image')">
          <span class="db-icon pdf-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
          </span>
          <span class="item-name">PDF</span>
          
        </button>

        <button class="flyout-item" (click)="exportFormat('png', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || !entitlementService.hasMemberAccess('export_image')">
          <span class="db-icon png-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
          </span>
          <span class="item-name">PNG</span>
          
        </button>

        <button class="flyout-item" (click)="exportFormat('svg', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || !entitlementService.hasMemberAccess('export_image')">
          <span class="db-icon svg-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2" />
              <polyline points="2 17 12 22 22 17" />
              <polyline points="2 12 12 17 22 12" />
            </svg>
          </span>
          <span class="item-name">SVG</span>
          
        </button>

        <div class="flyout-divider"></div>

        <div class="flyout-header">Export as SQL</div>

        <button class="flyout-item" (click)="exportSQL('postgres', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || exporting || !entitlementService.hasMemberAccess('export_sql')">
          <span class="db-icon postgres-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z" />
            </svg>
          </span>
          <span class="item-name">PostgreSQL</span>
          <app-icons *ngIf="isLoggedIn && !entitlementService.orgHasFeature('export_sql')" name="premium-crown" size="14" color="#f59e0b" style="margin-left: auto;"></app-icons>
          
        </button>

        <button class="flyout-item" (click)="exportSQL('mysql', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || exporting || !entitlementService.hasMemberAccess('export_sql')">
          <span class="db-icon mysql-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c.83 0 1.5.67 1.5 1.5S12.83 8 12 8s-1.5-.67-1.5-1.5S11.17 5 12 5zm0 14c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08C16.71 17.72 14.5 19 12 19z" />
            </svg>
          </span>
          <span class="item-name">MySQL</span>
          <app-icons *ngIf="isLoggedIn && !entitlementService.orgHasFeature('export_sql')" name="premium-crown" size="14" color="#f59e0b" style="margin-left: auto;"></app-icons>
          
        </button>

        <button class="flyout-item" (click)="exportSQL('mariadb', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || exporting || (entitlementService.orgHasFeature('export_sql') && !entitlementService.canUseFeature('export_sql'))">
          <span class="db-icon mariadb-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm4 0h-2v-4h2v4zm-2-8a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 13 9zm-4 0a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 9 9z" />
            </svg>
          </span>
          <span class="item-name">MariaDB</span>
          <app-icons *ngIf="isLoggedIn && !entitlementService.orgHasFeature('export_sql')" name="premium-crown"
            size="14" color="#f59e0b" style="margin-left: auto;"></app-icons>
        </button>

        <button class="flyout-item" (click)="exportSQL('sqlserver', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || exporting || !entitlementService.hasMemberAccess('export_sql')">
          <span class="db-icon mssql-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
            </svg>
          </span>
          <span class="item-name">SQL Server</span>
          <app-icons *ngIf="isLoggedIn && !entitlementService.orgHasFeature('export_sql')" name="premium-crown" size="14" color="#f59e0b" style="margin-left: auto;"></app-icons>
          
        </button>

        <!-- SQLite -->
        <button class="flyout-item export-item" id="export-sqlite-btn"
          (click)="exportSQL('sqlite')"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || exporting || !entitlementService.hasMemberAccess('export_sql')">
          <span class="db-icon sqlite-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" />
            </svg>
          </span>
          <span class="item-name">SQLite</span>
          <app-icons *ngIf="isLoggedIn && !entitlementService.orgHasFeature('export_sql')" name="premium-crown" size="14" color="#f59e0b" style="margin-left: auto;"></app-icons>
          
        </button>

        <!-- MongoDB (NoSQL) -->
        <button class="flyout-item" (click)="exportSQL('mongodb', $event)"
          [disabled]="isDiagramEmpty() || hasDbmlErrors() || exporting || !entitlementService.hasMemberAccess('export_sql')">
          <span class="db-icon mongodb-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C11.5 4.5 9 8 9 12c0 3.5 2 6.5 3 8 1-1.5 3-4.5 3-8 0-4-2.5-7.5-3-10z" />
            </svg>
          </span>
          <span class="item-name">MongoDB (NoSQL)</span>
          <app-icons *ngIf="isLoggedIn && !entitlementService.orgHasFeature('export_sql')" name="premium-crown" size="14" color="#f59e0b" style="margin-left: auto;"></app-icons>
          
        </button>

        <div class="flyout-status" *ngIf="exporting">
          <span class="spinner"></span> Converting...
        </div>
      </div>
    </div>

    <!-- Connect Button (directly below Export) -->
    <div class="activity-nav-item connect-item tt-right"
      [class.active]="false"
      [class.disabled]="!isLoggedIn || isSampleDiagram()"
      (click)="openConnectionStringModal($event)"
      [attr.data-tt]="!isLoggedIn ? 'Sign in to connect to a database' : (isSampleDiagram() ? 'Connection is disabled for sample diagrams' : 'Connect to a database')"
      aria-label="Connect to a database">
      <div class="sidebar-crown-badge" *ngIf="showCrown('connect')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      <div class="nav-icon-box">
        <app-icons name="connections" size="20"></app-icons>
      </div>
      <span class="nav-label">Connect</span>
    </div>

    <!-- Share Button -->
    <div class="activity-nav-item share-item tt-right" *ngIf="!isCanViewOnly"
      [class.tt]="!hasDbmlErrors()"
      [class.active]="svc.shareModalVisible()" [class.disabled]="!isLoggedIn || isSampleDiagram() || hasDbmlErrors() || isDiagramEmpty() || isMemberRestricted(['share_diagram'])"
      (click)="openShare($event)"
      [attr.data-tt]="isMemberRestricted(['share_diagram']) || hasDbmlErrors() ? null : (!isLoggedIn ? 'Sign in to share diagram' : (isSampleDiagram() ? 'Sharing is disabled for sample diagrams' : 'Share diagram'))"
      aria-label="Share diagram">
      <div class="sidebar-crown-badge" *ngIf="showCrown('share')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </div>
      <span class="nav-label">Share</span>
    </div>

    <!-- Versions Button (below Share, no New badge) -->
    <div class="activity-nav-item versions-item tt tt-right" *ngIf="!isCanViewOnly"
      [class.active]="svc.showVersionHistory()" [class.disabled]="!isLoggedIn || isSampleDiagram() || isMemberRestricted(['version_history'])"
      (click)="toggleVersionHistory($event)"
      [attr.data-tt]="isMemberRestricted(['version_history']) ? null : (!isLoggedIn ? 'Sign in for Version History' : (isSampleDiagram() ? 'Version History is disabled for sample diagrams' : 'Version History'))"
      aria-label="Version History">
      <div class="sidebar-crown-badge" *ngIf="showCrown('versions')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <polyline points="12 7 12 12 15 15" />
        </svg>
      </div>
      <span class="nav-label">Versions</span>
    </div>

    <!-- AI Assistant Button -->
    <div class="activity-nav-item ai-item tt tt-right" *ngIf="!isCanViewOnly"
      [class.active]="svc.showAiChat()" [class.disabled]="!isLoggedIn || isSampleDiagram() || isMemberRestricted(['ai_chat'])"
      (click)="toggleAiChat($event)"
      [attr.data-tt]="isMemberRestricted(['ai_chat']) ? null : (!isLoggedIn ? 'Sign in for DBNexus AI' : (isSampleDiagram() ? 'DBNexus AI is disabled for sample diagrams' : 'DBNexus AI'))"
      aria-label="DBNexus AI">
      <div class="sidebar-crown-badge" *ngIf="showCrown('ai')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          <path d="M5 3v4"/>
          <path d="M19 17v4"/>
          <path d="M3 5h4"/>
          <path d="M17 19h4"/>
        </svg>
      </div>
      <span class="nav-label">AI</span>
    </div>

    <!-- DBML Code Button -->
    <div class="activity-nav-item dbml-item tt tt-right"
      [class.active]="svc.sidebarInspectorTab() === null && !svc.showDiffChecker() && !svc.showDocs" (click)="showDbmlEditor($event)"
      [attr.data-tt]="!isLoggedIn || isSampleDiagram() ? 'DBML Code Editor (Read-Only)' : 'DBML Code Editor'"
      aria-label="DBML Code Editor">
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <span class="nav-label">DBML</span>
    </div>

    <!-- Diff Checker Button -->
    <div class="activity-nav-item diff-item tt tt-right" [class.active]="svc.showDiffChecker()" [class.disabled]="isMemberRestricted(['code_compare'])"
      (click)="toggleDiffChecker($event)" [attr.data-tt]="isMemberRestricted(['code_compare']) ? null : 'SQL Compare'" aria-label="SQL Compare">
      <div class="sidebar-crown-badge" *ngIf="showCrown('compare')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="7" height="16" rx="1.5" />
          <rect x="14" y="4" width="7" height="16" rx="1.5" />
          <line x1="6.5" y1="9" x2="7.5" y2="9" />
          <line x1="6.5" y1="13" x2="7.5" y2="13" />
          <line x1="16.5" y1="9" x2="18.5" y2="9" />
          <line x1="16.5" y1="13" x2="18.5" y2="13" />
        </svg>
      </div>
      <span class="nav-label">Compare</span>
    </div>

    <!-- Tables Button -->
    <div class="activity-nav-item tables-item tt tt-right" *ngIf="!isCanViewOnly"
      [class.active]="svc.sidebarInspectorTab() === 'tables' && !svc.showDiffChecker() && !svc.showDocs"
      [class.disabled]="!isLoggedIn || isSampleDiagram() || isMemberRestricted(['table_relationships'])" (click)="toggleInspector('tables', $event)"
      [attr.data-tt]="isMemberRestricted(['table_relationships']) ? null : (!isLoggedIn ? 'Sign in to access Tables' : (isSampleDiagram() ? 'Tables disabled for sample diagrams' : 'Tables'))"
      aria-label="Tables">
      <div class="sidebar-crown-badge" *ngIf="showCrown('tables')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="3" y1="15" x2="21" y2="15"></line>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </div>
      <span class="nav-label">Tables</span>
    </div>

    <!-- Refs / Relationships Button -->
    <div class="activity-nav-item refs-item tt tt-right"
      [class.active]="svc.sidebarInspectorTab() === 'refs' && !svc.showDiffChecker() && !svc.showDocs"
      [class.disabled]="!isLoggedIn || isSampleDiagram() || isMemberRestricted(['table_relationships'])" (click)="toggleInspector('refs', $event)"
      [attr.data-tt]="isMemberRestricted(['table_relationships']) ? null : (!isLoggedIn ? 'Sign in to access Relationships' : (isSampleDiagram() ? 'Relationships disabled for sample diagrams' : 'Relationships'))"
      aria-label="Relationships">
      <div class="sidebar-crown-badge" *ngIf="showCrown('refs')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"></circle>
          <circle cx="18" cy="18" r="3"></circle>
          <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"></line>
          <circle cx="18" cy="6" r="3"></circle>
          <line x1="15.5" y1="8.5" x2="8.5" y2="15.5"></line>
        </svg>
      </div>
      <span class="nav-label">Refs</span>
    </div>  
    <!-- View Docs Button -->
    <div class="activity-nav-item docs-item tt tt-right" [class.active]="svc.showDocs"
      [class.disabled]="!isLoggedIn || isSampleDiagram() || isMemberRestricted(['document_view'])" (click)="toggleDocs($event)"
      [attr.data-tt]="isMemberRestricted(['document_view']) ? null : (!isLoggedIn ? 'Sign in to access Docs' : (isSampleDiagram() ? 'Docs disabled for sample diagrams' : (svc.showDocs ? 'View Diagram' : 'View Docs')))"
      [attr.aria-label]="svc.showDocs ? 'View Diagram' : 'View Docs'">
      <div class="sidebar-crown-badge" *ngIf="showCrown('docs')"><app-icons name="premium-crown" size="13" color="#f59e0b"></app-icons></div>
      
      <div class="nav-icon-box">
        <svg *ngIf="!svc.showDocs" class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6"></path>
          <path d="M9 13h6"></path>
          <path d="M9 17h6"></path>
          <path d="M9 9h1"></path>
        </svg>
        <svg *ngIf="svc.showDocs" class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <path d="M10 6.5h4M17.5 10v4M14 17.5h-4M6.5 14v-4" stroke-dasharray="2 2"></path>
        </svg>
      </div>
      <span class="nav-label">{{ svc.showDocs ? 'Diagram' : 'View Docs' }}</span>
    </div>
  
  </div>

  <!-- Flexible Spacer pushing Sign Out to the bottom -->
  <div class="activity-spacer"></div>

  <!-- Bottom section: Sign Out Button -->
  <div class="activity-bottom-group" *ngIf="isLoggedIn">
    <div class="activity-nav-item logout-item tt tt-right" (click)="handleSignOut($event)" data-tt="Sign Out"
      aria-label="Sign Out">
      <div class="nav-icon-box">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </div>
      <span class="nav-label">Sign Out</span>
    </div>
  </div>
</aside>
