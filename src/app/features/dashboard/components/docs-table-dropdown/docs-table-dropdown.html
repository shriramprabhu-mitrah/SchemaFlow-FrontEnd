<div class="docs-table-dropdown-menu" (click)="$event.stopPropagation()">
  <div class="dropdown-header">
    <div class="dropdown-title-wrap">
      <h2>Select Tables to View</h2>
    </div>
    <button class="dropdown-close-btn" (click)="onClose($event)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="dropdown-controls">
    <div class="dropdown-search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" [(ngModel)]="tableSearchQuery" placeholder="Search tables..." (click)="$event.stopPropagation()" />
    </div>

    <div class="dropdown-action-bar">
      <span class="action-count">{{ selectedTables.size }}/{{ svc.tables.length }} tables selected</span>
      <button class="global-visibility-btn" (click)="onToggleAll()" [title]="isAllSelected() ? 'Unselect All' : 'Select All'">
        <svg *ngIf="isAllSelected()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg *ngIf="!isAllSelected()" class="hidden-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="dropdown-table-list">
    <div class="dropdown-table-item" *ngFor="let t of getFilteredDropdownTables()" (click)="onToggleTable(t.name, $event); $event.stopPropagation()">
      <span class="node-icon table-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      </span>
      <span class="table-item-name" [class.dimmed]="!isTableSelected(t.name)">{{ t.name }}</span>
      <span class="table-conn-count" *ngIf="getTableRelationships(t.name).length > 0">
        ({{ getTableRelationships(t.name).length }} rel)
      </span>
      <span class="spacer" style="flex: 1"></span>
      <button class="visibility-toggle-btn" (click)="onToggleTable(t.name, $event); $event.stopPropagation()">
        <svg *ngIf="isTableSelected(t.name)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg *ngIf="!isTableSelected(t.name)" class="hidden-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>
</div>
