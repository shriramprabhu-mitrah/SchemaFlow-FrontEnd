<div class="ai-chat-container" [class.light]="svc.theme() === 'light'">
  <!-- Top Session Header -->
  <div class="ai-chat-header">
    <div class="header-left">
      <svg class="chat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="session-title">{{ sessionTitle() }}</span>
    </div>

    <div class="header-actions">
      <!-- New Chat Button -->
      <!-- <button type="button" class="header-action-btn tt tt-bottom" data-tt="New Chat" aria-label="New Chat"
        (click)="startNewChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button> -->

      <!-- History / Clock Button -->
      <button type="button" class="header-action-btn tt tt-bottom" data-tt="Chat History" aria-label="Chat History">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>

      <!-- Close Button -->
      <button type="button" class="header-action-btn close-action tt tt-bottom" data-tt="Close AI Chat"
        aria-label="Close AI Chat" (click)="onClose()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Scrollable Message Body -->
  <div class="ai-chat-body" #messagesContainer>
    <!-- Welcome View (Default before messages) -->
    <div class="ai-welcome-view" *ngIf="messages().length === 0">
      <!-- Hero Header -->
      <div class="welcome-hero">
        <div class="ai-sparkle-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
            <path d="M5 3v4" />
            <path d="M19 17v4" />
            <path d="M3 5h4" />
            <path d="M17 19h4" />
          </svg>
        </div>
        <div class="welcome-title-wrap">
          <h2 class="welcome-title">Welcome to DBNexus AI</h2>
          <span class="beta-badge">BETA</span>
        </div>
        <p class="welcome-subtitle">Your intelligent assistant for database design</p>
      </div>

      <!-- Quick Suggested Prompt Cards List -->
      <div class="prompt-cards-list">
        <div *ngFor="let card of promptCards" class="prompt-card" (click)="selectCard(card)">
          <div class="card-icon-box">
            <!-- Table Groups Icon -->
            <svg *ngIf="card.icon === 'table_groups'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>

            <!-- Timestamp Icon -->
            <svg *ngIf="card.icon === 'timestamp'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>

            <!-- Relationships Icon -->
            <svg *ngIf="card.icon === 'relationships'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3"></circle>
              <circle cx="18" cy="18" r="3"></circle>
              <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"></line>
            </svg>

            <!-- Indexes Icon -->
            <svg *ngIf="card.icon === 'indexes'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>

            <!-- Learn Database Design Icon -->
            <svg *ngIf="card.icon === 'learn'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>

            <!-- Remap Data Types Icon -->
            <svg *ngIf="card.icon === 'remap'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
          </div>

          <div class="card-text-wrap">
            <h4 class="card-title">{{ card.title }}</h4>
            <p class="card-desc">{{ card.desc }}</p>
          </div>

          <div class="card-right-action" *ngIf="card.hasChevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Active Messages View -->
    <div class="ai-messages-list" *ngIf="messages().length > 0">
      <div *ngFor="let msg of messages()" class="chat-message-item" [class.user-message]="msg.sender === 'user'"
        [class.assistant-message]="msg.sender === 'assistant'">
        <!-- Message Avatar -->
        <div class="msg-avatar" *ngIf="msg.sender === 'assistant'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
          </svg>
        </div>

        <div class="msg-content-wrap">
          <div class="msg-bubble">
            <p class="msg-text">{{ msg.text }}</p>

            <!-- Code Snippet Box if provided -->
            <div class="code-snippet-box" *ngIf="msg.codeSnippet">
              <div class="snippet-header">
                <span class="snippet-lang">DBML</span>
                <div class="snippet-actions">
                  <button type="button" class="btn-snippet-copy" (click)="copySnippet(msg.codeSnippet, msg.id)">
                    <svg *ngIf="copiedSnippetId() !== msg.id" width="12" height="12" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <svg *ngIf="copiedSnippetId() === msg.id" width="12" height="12" viewBox="0 0 24 24" fill="none"
                      stroke="#10b981" stroke-width="3">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>{{ copiedSnippetId() === msg.id ? 'Copied!' : 'Copy' }}</span>
                  </button>
                  <button type="button" class="btn-snippet-apply" (click)="applySnippet(msg)" [disabled]="msg.applied">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="16 18 22 12 16 6"></polyline>
                      <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    <span>{{ msg.applied ? 'Applied' : 'Apply to Editor' }}</span>
                  </button>
                </div>
              </div>
              <pre class="snippet-pre"><code>{{ msg.codeSnippet }}</code></pre>
            </div>
            <div class="msg-meta-row">
              <span class="msg-model-tag" *ngIf="msg.modelName">{{ msg.modelName }}</span>
              <span class="msg-time">{{ msg.timestamp | date:'shortTime' }}</span>
            </div>
          </div>
        </div>

        <!-- Thinking Indicator -->
        <div class="chat-message-item assistant-message thinking-item" *ngIf="isThinking()">
          <div class="msg-avatar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
            </svg>
          </div>
          <div class="thinking-bubble">
            <span class="dot-pulse"></span>
            <span class="dot-pulse"></span>
            <span class="dot-pulse"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Input Box -->
    <div class="ai-chat-footer">
      <div class="input-card-wrap">
        <textarea class="ai-input-textarea" [(ngModel)]="promptText" (keydown)="onKeyDown($event)" rows="2"
          placeholder="Ask me anything about your diagram..."></textarea>

        <div class="input-footer-row">
          <span class="input-hint-text">Press Enter to send, Shift+Enter for new line</span>
          <div class="footer-actions-right">
            <!-- Model Selector Dropdown -->
            <div class="model-dropdown-container">
              <button type="button" class="model-select-btn" [class.open]="isModelDropdownOpen()"
                (click)="toggleModelDropdown($event)" aria-label="Select AI Model"
                [attr.title]="'Selected model: ' + selectedModel().name">
                <span class="model-current-name">{{ selectedModel().name }}</span>
                <svg class="model-chevron-icon" width="11" height="11" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>

              <!-- Dropdown Menu Popup -->
              <div class="model-dropdown-menu" *ngIf="isModelDropdownOpen()" (click)="$event.stopPropagation()">
                <div class="model-menu-header">Select Model</div>
                <div class="model-menu-list">
                  <button type="button" *ngFor="let model of availableModels" class="model-menu-item"
                    [class.active]="selectedModel().id === model.id" (click)="selectModel(model, $event)">
                    <div class="model-item-main">
                      <div class="model-item-title-row">
                        <span class="model-item-name">{{ model.name }}</span>
                        <span class="model-item-tag" *ngIf="model.tag">{{ model.tag }}</span>
                      </div>
                      <span class="model-item-desc" *ngIf="model.desc">{{ model.desc }}</span>
                    </div>
                    <svg *ngIf="selectedModel().id === model.id" class="model-check-icon" width="13" height="13"
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                      stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <button type="button" class="send-btn" [disabled]="!promptText().trim() || isThinking()"
              (click)="sendMessage()" aria-label="Send message">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
