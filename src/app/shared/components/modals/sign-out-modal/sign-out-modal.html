<div
  class="signout-modal-backdrop"
  *ngIf="signOutService.isOpen()"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="signout-modal-title"
>
  <div class="signout-modal-card" (click)="$event.stopPropagation()">
    <!-- Close button at right top corner -->
    <button
      type="button"
      class="signout-modal-close"
      (click)="signOutService.cancel()"
      [disabled]="signOutService.isSigningOut()"
      aria-label="Close dialog"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Header centered -->
    <div class="signout-modal-header">
      <div class="signout-header-content">
        <div class="signout-icon-badge" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>
        <div class="signout-title-wrap">
          <h3 id="signout-modal-title" class="signout-modal-title">Sign Out</h3>
          <p class="signout-modal-subtitle">Confirm account logout</p>
        </div>
      </div>
    </div>

    <!-- Body centered -->
    <div class="signout-modal-body">
      <p class="signout-message">
        Are you sure you want to sign out?
      </p>
    </div>

    <!-- Footer centered -->
    <div class="signout-modal-footer">
      <button
        type="button"
        class="btn-signout-cancel"
        (click)="signOutService.cancel()"
        [disabled]="signOutService.isSigningOut()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="btn-signout-confirm"
        (click)="signOutService.confirm()"
        [disabled]="signOutService.isSigningOut()"
      >
        <svg
          *ngIf="!signOutService.isSigningOut()"
          class="signout-btn-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span *ngIf="signOutService.isSigningOut()" class="signout-spinner" aria-hidden="true"></span>
        <span>{{ signOutService.isSigningOut() ? 'Signing Out...' : 'Sign Out' }}</span>
      </button>
    </div>
  </div>
</div>
