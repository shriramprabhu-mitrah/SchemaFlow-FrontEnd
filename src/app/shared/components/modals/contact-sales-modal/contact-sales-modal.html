<div class="modal-overlay" *ngIf="visible">
  <div class="modal-content modal-lg-700" [class.success-state]="submitSuccess() === true" (click)="$event.stopPropagation()">
    <div class="modal-header" *ngIf="submitSuccess() === false">
      <h3 class="contact-modal-heading">Contact Us</h3>
      <button class="modal-close ml-auto" (click)="closeModal()">✕</button>
    </div>

    <div class="modal-body">
      <ng-container *ngIf="submitSuccess() === false">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">

          <div class="form-row">
            <div class="form-group form-col">
              <label class="form-label">Your name <span class="text-danger">*</span></label>
              <input type="text" class="form-input" formControlName="name"
                [class.is-invalid]="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" />
              <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched"
                class="error-message">
                Name is required.
              </div>
            </div>
            <div class="form-group form-col">
              <label class="form-label">Your email <span class="text-danger">*</span></label>
              <input type="email" class="form-input" formControlName="company_email"
                [class.is-invalid]="contactForm.get('company_email')?.invalid && contactForm.get('company_email')?.touched" />
              <div *ngIf="contactForm.get('company_email')?.invalid && contactForm.get('company_email')?.touched"
                class="error-message">
                Valid email is required.
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group form-col">
              <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-input" formControlName="phone_number"
                [class.is-invalid]="contactForm.get('phone_number')?.invalid && contactForm.get('phone_number')?.touched" />
              <div *ngIf="contactForm.get('phone_number')?.invalid && contactForm.get('phone_number')?.touched"
                class="error-message">
                Valid phone number is required.
              </div>
            </div>
            <div class="form-group form-col">
              <label class="form-label">Country <span class="text-muted">(Optional)</span></label>
              <div class="custom-dropdown-container dropdown-container-rel" style="width: 100%;">
                <button type="button" class="form-input custom-dropdown-trigger" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; height: 38px; border-radius: 8px;"
                  (click)="showCountryDropdown = !showCountryDropdown; $event.stopPropagation()">
                  <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ contactForm.get('country')?.value || 'Select Country' }}</span>
                  <app-icons name="chevron-down" size="14"></app-icons>
                </button>
                <div class="custom-dropdown-menu" *ngIf="showCountryDropdown" style="width: 100%; max-height: 200px; overflow-y: auto;" (click)="$event.stopPropagation()">
                  <button type="button" class="custom-dropdown-option" *ngFor="let c of countries" 
                    [class.selected]="contactForm.get('country')?.value === c" 
                    (click)="contactForm.patchValue({country: c}); showCountryDropdown = false">
                    {{ c }}
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group mb-16">
            <label class="form-label">Enquiry type <span class="text-danger">*</span></label>
            <div class="btn-group" style="gap: 10px; display: flex;">
              <button type="button" class="btn-pill" style="flex: 1;"
                [ngClass]="enquiryType === 'Sales' ? 'btn-primary' : 'btn-secondary'"
                (click)="setEnquiryType('Sales')">
                <span style="margin-right: 5px;">$</span> Sales
              </button>
              <button type="button" class="btn-pill" style="flex: 1;"
                [ngClass]="enquiryType === 'Support' ? 'btn-primary' : 'btn-secondary'"
                (click)="setEnquiryType('Support')">
                <span style="margin-right: 5px;">@</span> Support
              </button>
            </div>
          </div>

          <div class="form-group mb-16">
            <label class="form-label">Enquiry Details <span class="text-danger">*</span></label>
            <textarea class="form-input" formControlName="project_details" rows="4"
              [class.is-invalid]="contactForm.get('project_details')?.invalid && contactForm.get('project_details')?.touched"></textarea>
            <div *ngIf="contactForm.get('project_details')?.invalid && contactForm.get('project_details')?.touched"
              class="error-message">
              Enquiry details are required.
            </div>
          </div>

          <div class="form-group mb-24">
            <label class="form-label">Upload Image <span class="text-muted">(Optional for issues)</span></label>
            <div class="custom-file-upload">
              <label for="file-upload" class="file-upload-label"
                [class.dragover]="isDragging"
                (dragover)="onDragOver($event)"
                (dragleave)="onDragLeave($event)"
                (drop)="onDrop($event)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>{{ selectedFileName() ? selectedFileName() : 'Click or drag and drop to select an image' }}</span>
              </label>
              <input id="file-upload" type="file" class="hidden-file-input" accept="image/*" (change)="onFileChange($event)" />
            </div>
          </div>

          <div *ngIf="submitError() !== ''" class="submit-error-message">
            {{ submitError() }}
          </div>

        </form>
      </ng-container>

      <div *ngIf="submitSuccess() === true" class="success-container">
        <div class="success-icon-wrapper">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <h3 class="success-title">Request Submitted!</h3>
        <div class="success-description">
          Your request has been submitted to the sales team.<br>We will come back to you shortly.
        </div>
        <button class="btn-primary" (click)="closeModal()">Close</button>
      </div>
    </div>

    <div class="modal-footer" *ngIf="submitSuccess() === false">
      <button class="btn-primary" (click)="onSubmit()" [disabled]="isSubmitting() === true">
        {{ isSubmitting() === true ? 'Submitting...' : 'Submit' }}
      </button>
    </div>
  </div>
</div>
