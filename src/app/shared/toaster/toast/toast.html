<div *ngIf="svc.toastMessage() as msg" class="dbml-toast" [ngStyle]="getToastStyle()"
  [ngClass]="{ 
    'toast-error': svc.toastType() === 'error', 
    'toast-success': svc.toastType() === 'success',
    'dashboard-toast': isDashboard,
    'admin-toast': !isDashboard
  }">

  <div class="toast-content">
    <!-- Old Icons (dashboard) -->
    <svg *ngIf="svc.toastType() === 'success' && isDashboard" class="toast-icon" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
    </svg>

    <svg *ngIf="svc.toastType() === 'error' && isDashboard" class="toast-icon" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
    </svg>

    <!-- New Icons (admin) -->
    <svg *ngIf="svc.toastType() === 'error' && !isDashboard" class="toast-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>

    <svg *ngIf="svc.toastType() === 'success' && !isDashboard" class="toast-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>

    <span class="toast-text">{{ msg }}</span>
  </div>
</div>
