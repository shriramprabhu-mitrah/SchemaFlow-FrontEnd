<div *ngIf="shouldShow()"
  class="dbml-toast"
  [class.toast-error]="svc.toastType() === 'error'"
  [class.toast-success]="svc.toastType() === 'success'"
  [class.toast-info]="svc.toastType() === 'info'"
  [class.toast-dark]="isDark()"
  [class.toast-light]="!isDark()"
  role="alert"
  aria-live="assertive">

    <div class="toast-header">
      <span class="toast-title">
        {{ svc.toastType() === 'success' ? 'Success' : svc.toastType() === 'error' ? 'Error' : 'Info' }}
      </span>
      <button class="toast-dismiss" (click)="dismiss()" aria-label="Dismiss">×</button>
    </div>
    <div class="toast-body">{{ svc.toastMessage() }}</div>
</div>
