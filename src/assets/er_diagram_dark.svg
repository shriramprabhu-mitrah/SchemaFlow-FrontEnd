<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 988 616" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 1 L10 6 L2 11" fill="none" stroke="#6fb9b3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <symbol id="ico-table" viewBox="0 0 16 16">
      <rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="#fff" stroke-width="1.4"/>
      <path d="M1.5 6h13M1.5 9.5h13M6 6v7.5" stroke="#fff" stroke-width="1.2" fill="none"/>
      <rect x="1.5" y="2.5" width="13" height="3.5" fill="#fff"/>
    </symbol>

    <symbol id="ico-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11.5" fill="#e9fbfa"/>
      <g fill="#2fa9a5" transform="translate(12 12)">
        <circle r="5.2" fill="none" stroke="#2fa9a5" stroke-width="2.6"/>
        <g id="teeth">
          <rect x="-1.5" y="-8.6" width="3" height="4" rx="0.6"/>
          <rect x="-1.5" y="4.6" width="3" height="4" rx="0.6"/>
          <rect x="-8.6" y="-1.5" width="4" height="3" rx="0.6"/>
          <rect x="4.6" y="-1.5" width="4" height="3" rx="0.6"/>
        </g>
        <use href="#teeth" transform="rotate(45)"/>
        <circle r="2" fill="#e9fbfa"/>
      </g>
    </symbol>

    <symbol id="ico-key" viewBox="0 0 16 16">
      <circle cx="5" cy="5" r="3.4" fill="#f5b400" stroke="#3b2a00" stroke-width="1"/>
      <circle cx="4.2" cy="4.2" r="1" fill="#fff6d0"/>
      <path d="M7.4 7.4 L14 14 M11 11 l1.8 -1.8 M12.6 12.6 l1.6 -1.6" stroke="#3b2a00" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M7.4 7.4 L14 14 M11 11 l1.8 -1.8 M12.6 12.6 l1.6 -1.6" stroke="#f5b400" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </symbol>

    <symbol id="ico-fk" viewBox="0 0 16 16">
      <g fill="none" stroke="#e3e8f0" stroke-width="1.5" stroke-linecap="round">
        <rect x="1.2" y="6" width="8" height="4.6" rx="2.3" transform="rotate(-40 5.2 8.3)"/>
        <rect x="6.8" y="5.4" width="8" height="4.6" rx="2.3" transform="rotate(-40 10.8 7.7)"/>
      </g>
    </symbol>

    <symbol id="ico-unique" viewBox="0 0 16 16">
      <path d="M8 1 L15 8 L8 15 L1 8 Z" fill="#12a5d8" stroke="#0a4f6b" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="8" cy="8" r="2.2" fill="#e8f8ff" stroke="#0a4f6b" stroke-width="1"/>
    </symbol>

    <symbol id="ico-grip" viewBox="0 0 8 12">
      <g fill="none" stroke="#8a7a3a" stroke-width="1.1" stroke-linecap="round">
        <circle cx="2" cy="2" r="0.9"/><circle cx="6" cy="2" r="0.9"/>
        <circle cx="2" cy="6" r="0.9"/><circle cx="6" cy="6" r="0.9"/>
        <circle cx="2" cy="10" r="0.9"/><circle cx="6" cy="10" r="0.9"/>
      </g>
    </symbol>
  </defs>

  <!-- ================= RELATIONSHIP LINES ================= -->
  <g fill="none" stroke="#6fb9b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- users -> refresh_tokens -->
    <path d="M366 300 H385 Q397 300 397 288 V153 Q397 141 409 141 H426" marker-end="url(#arrow)"/>
    <!-- users -> jobs -->
    <path d="M366 300 H431 Q443 300 443 312 V341 Q443 353 455 353 H496" marker-end="url(#arrow)"/>
  </g>
  <g font-weight="700" fill="#9fb0c3">
    <text x="374" y="294" font-size="14">1</text>
    <text x="408" y="136" font-size="20">*</text>
    <text x="478" y="350" font-size="20">*</text>
  </g>

  <!-- ================= TABLE: refresh_tokens ================= -->
  <g transform="translate(426 63)">
    <g filter="url(#shadow)">
      <rect width="220" height="154" rx="3" fill="#171f36"/>
    </g>
    <path d="M0 33 V3 a3 3 0 0 1 3 -3 H217 a3 3 0 0 1 3 3 V33 Z" fill="#3ec5c1"/>
    <use href="#ico-table" x="11" y="10" width="14" height="14"/>
    <text x="31" y="22" font-size="13.5" font-weight="700" fill="#fff">refresh_tokens</text>
    <use href="#ico-gear" x="191" y="8" width="18" height="18"/>

    <path d="M0 63 H220 M0 93 H220 M0 123 H220" stroke="#2b3654" stroke-width="1"/>
    <g font-size="13.5" font-weight="600" fill="#e6ebf3">
      <use href="#ico-key" x="11" y="40" width="16" height="16"/>
      <text x="32" y="53">id</text>
      <use href="#ico-fk" x="11" y="70" width="16" height="16"/>
      <text x="32" y="83">user_id</text>
      <text x="11" y="113">token</text>
      <text x="11" y="143">expires_at</text>
    </g>
    <g font-size="12.5" fill="#aab4c6" text-anchor="end">
      <text x="208" y="53">int</text>
      <text x="208" y="83">int</text>
      <text x="208" y="113">text</text>
      <text x="208" y="143">timestamp</text>
    </g>
  </g>

  <!-- ================= TABLE: users ================= -->
  <g transform="translate(146 253)">
    <g filter="url(#shadow)">
      <rect width="220" height="123" rx="3" fill="#171f36"/>
    </g>
    <path d="M0 33 V3 a3 3 0 0 1 3 -3 H217 a3 3 0 0 1 3 3 V33 Z" fill="#3ec5c1"/>
    <use href="#ico-table" x="11" y="10" width="14" height="14"/>
    <text x="31" y="22" font-size="13.5" font-weight="700" fill="#fff">users</text>
    <use href="#ico-gear" x="191" y="8" width="18" height="18"/>

    <path d="M0 63 H220 M0 93 H220" stroke="#2b3654" stroke-width="1"/>
    <g font-size="13.5" font-weight="600" fill="#e6ebf3">
      <use href="#ico-key" x="11" y="40" width="16" height="16"/>
      <text x="32" y="53">id</text>
      <use href="#ico-unique" x="11" y="70" width="16" height="16"/>
      <text x="32" y="83">username</text>
      <text x="11" y="113">password</text>
    </g>
    <g font-size="12.5" fill="#aab4c6" text-anchor="end">
      <text x="208" y="53">int</text>
      <text x="208" y="83">varchar</text>
      <text x="208" y="113">varchar</text>
    </g>
  </g>

  <!-- ================= TABLE: jobs ================= -->
  <g transform="translate(496 275)">
    <g filter="url(#shadow)">
      <rect width="220" height="154" rx="3" fill="#171f36"/>
    </g>
    <path d="M0 33 V3 a3 3 0 0 1 3 -3 H217 a3 3 0 0 1 3 3 V33 Z" fill="#3ec5c1"/>
    <use href="#ico-table" x="11" y="10" width="14" height="14"/>
    <text x="31" y="22" font-size="13.5" font-weight="700" fill="#fff">jobs</text>
    <use href="#ico-gear" x="191" y="8" width="18" height="18"/>

    <path d="M0 63 H220 M0 93 H220 M0 123 H220" stroke="#2b3654" stroke-width="1"/>
    <g font-size="13.5" font-weight="600" fill="#e6ebf3">
      <use href="#ico-key" x="11" y="40" width="16" height="16"/>
      <text x="32" y="53">id</text>
      <use href="#ico-fk" x="11" y="70" width="16" height="16"/>
      <text x="32" y="83">user_id</text>
      <text x="11" y="113">job_name</text>
      <text x="11" y="143">schedule</text>
    </g>
    <g font-size="12.5" fill="#aab4c6" text-anchor="end">
      <text x="208" y="53">int</text>
      <text x="208" y="83">int</text>
      <text x="208" y="113">varchar</text>
      <text x="208" y="143">varchar</text>
    </g>
  </g>

  <!-- ================= NOTE: refresh_token_notes ================= -->
  <g transform="translate(662 80)">
    <g filter="url(#shadow)">
      <rect width="180" height="179" rx="4" fill="#ffe08a"/>
    </g>
    <path d="M0 25 V4 a4 4 0 0 1 4 -4 H176 a4 4 0 0 1 4 4 V25 Z" fill="#e8ce7c"/>
    <use href="#ico-grip" x="7" y="7" width="6" height="12"/>
    <text x="22" y="17" font-size="11" font-weight="600" fill="#3b3520">refresh_token_n...</text>
    <g fill="#3b3520">
      <circle cx="164" cy="6" r="1.5"/><circle cx="164" cy="12" r="1.5"/><circle cx="164" cy="18" r="1.5"/>
    </g>
    <g font-size="12.5" fill="#2b2716">
      <text x="8" y="46">Stores refresh tokens used to</text>
      <text x="8" y="63">generate new access tokens.</text>
    </g>
  </g>

  <!-- ================= NOTE: users_notes ================= -->
  <g transform="translate(217 391)">
    <g filter="url(#shadow)">
      <rect width="180" height="180" rx="4" fill="#ffe08a"/>
    </g>
    <path d="M0 25 V4 a4 4 0 0 1 4 -4 H176 a4 4 0 0 1 4 4 V25 Z" fill="#e8ce7c"/>
    <use href="#ico-grip" x="7" y="7" width="6" height="12"/>
    <text x="22" y="17" font-size="11" font-weight="600" fill="#3b3520">users_notes</text>
    <g fill="#3b3520">
      <circle cx="164" cy="6" r="1.5"/><circle cx="164" cy="12" r="1.5"/><circle cx="164" cy="18" r="1.5"/>
    </g>
    <g font-size="12.5" fill="#2b2716">
      <text x="8" y="46">Stores registered users.</text>
      <text x="8" y="63">Password is stored as a bcrypt</text>
      <text x="8" y="80">hash</text>
    </g>
  </g>
</svg>
