<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -10 638 399" width="638" height="399" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sharing dialog (dark theme)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="modalShadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="focusGlow" x="-10%" y="-60%" width="120%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.500"/>
    </filter>
    <clipPath id="linkClip"><rect x="64" y="202" width="456" height="32" rx="5"/></clipPath>
    <clipPath id="textClip"><rect x="76" y="202" width="432" height="32"/></clipPath>
    <style>
      text { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
      .mono { font-family: "Liberation Mono", "Courier New", Courier, monospace; }
      .lbl { font-size: 13.500px; fill: #e5e7eb; }
      .btnText { font-size: 12.500px; font-weight: 700; text-anchor: middle; }
      .field { fill: #0b111c; stroke: #232d40; stroke-width: 1; }
    </style>
  </defs>

  <!-- Modal -->
  <rect x="33" y="30" width="558" height="319" rx="12" fill="#141b2b" filter="url(#modalShadow)"/>
  <rect x="33.500" y="30.500" width="557" height="318" rx="12" fill="none" stroke="#2b3447"/>

  <!-- Header -->
  <text x="63" y="66" font-size="13.500" font-weight="700" fill="#ffffff">Sharing</text>
  <line x1="44" y1="85.500" x2="580" y2="85.500" stroke="#263043"/>
  <rect x="63" y="83" width="51" height="2" fill="#3ec9c4"/>
  <path d="M543.500 56.500l10 10M553.500 56.500l-10 10" stroke="#cbd5e1" stroke-width="1.400" stroke-linecap="round" fill="none"/>

  <!-- Public Diagram toggle -->
  <text x="63" y="127.500" font-size="13" font-weight="700" fill="#ffffff">Public Diagram</text>
  <rect x="170" y="114" width="34" height="18" rx="9" fill="#3ec9c4"/>
  <circle cx="195" cy="123" r="7" fill="#eafffe"/>

  <!-- Save Settings -->
  <rect x="449" y="106" width="112" height="34" rx="5" fill="#3ec9c4"/>
  <text x="505" y="127" class="btnText" fill="#0b1a22">Save Settings</text>

  <!-- Share link -->
  <text x="63" y="187" class="lbl">Share this link with others</text>
  <rect x="63.500" y="201.500" width="457" height="33" rx="6" class="field"/>
  <g clip-path="url(#textClip)">
    <text x="76" y="222" font-size="11.400" class="mono" fill="#3ec9c4" xml:space="preserve">https://your-domain.com/public-diagram/3bc962f7-ff4f-4576-851f-55</text>
  </g>
  <rect x="527.500" y="201.500" width="33" height="33" rx="6" fill="#151c2c" stroke="#2b3447"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="1.400" stroke-linejoin="round" stroke-linecap="round">
    <rect x="542" y="215" width="9" height="9" rx="1.500"/>
    <path d="M538.500 218.500v-6.500a1.500 1.500 0 0 1 1.500-1.500h6.500"/>
  </g>

  <!-- Send via email -->
  <text x="63" y="261" class="lbl">Send link via email</text>
  <rect x="63" y="275" width="419" height="34" rx="7" fill="none" stroke="#3ec9c4" stroke-width="3" opacity="0.45" filter="url(#focusGlow)"/>
  <rect x="63.500" y="275.500" width="418" height="33" rx="6" fill="#0b111c" stroke="#3ec9c4" stroke-width="1.200"/>
  <text x="76" y="297" font-size="13" fill="#5b6577">Email, comma or space separated</text>
  <rect x="496" y="275" width="65" height="34" rx="5" fill="#2c7c80"/>
  <text x="528.500" y="296" class="btnText" fill="#0b1a22">Share</text>
</svg>
