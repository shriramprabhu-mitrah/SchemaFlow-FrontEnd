<svg xmlns="http://www.w3.org/2000/svg" viewBox="41 30 582 663" width="582" height="663" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Connect to a Database dialog" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .label { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.6px; }
      .input { fill: #fff; stroke: #cbd5e1; stroke-width: 1; }
      .val { font-size: 14px; fill: #0f172a; }
      .ph { font-size: 14px; fill: #94a3b8; }
      .icon { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Modal -->
  <rect x="42.500" y="31.500" width="579" height="660" rx="14" fill="#fff" stroke="#e2e8f0"/>

  <!-- Header -->
  <g class="icon" stroke="#475569">
    <path d="M70.5 62.5l-1.8 1.8a3.2 3.2 0 0 0 4.5 4.5l2-2"/>
    <path d="M73.5 65.5l1.8-1.8a3.2 3.2 0 0 0-4.5-4.5l-2 2"/>
    <path d="M70 66l4-4"/>
  </g>
  <text x="91" y="71" font-size="15" font-weight="700" fill="#0f172a">Connect to a Database</text>
  <g stroke="#475569" stroke-width="1.8" stroke-linecap="round">
    <path d="M587 62l7 7M594 62l-7 7"/>
  </g>
  <line x1="42" y1="97.500" x2="622" y2="97.500" stroke="#e2e8f0"/>

  <!-- Database type -->
  <text x="63" y="129" class="label">DATABASE TYPE</text>
  <rect x="63.500" y="138.500" width="537" height="41" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="78" y="164" class="val">PostgreSQL</text>
  <path d="M577 157.500l3.500 3.500 3.500-3.500" class="icon" stroke-width="1.4"/>

  <!-- Connect by -->
  <text x="63" y="217" class="label">CONNECT BY</text>
  <rect x="63.500" y="226.500" width="537" height="40" rx="8" fill="#eef2f7" stroke="#dbe3ee"/>
  <rect x="68" y="231" width="259" height="31" rx="6" fill="#337ab7"/>
  <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round">
    <rect x="140" y="241" width="11" height="4.500" rx="1"/>
    <rect x="140" y="247.500" width="11" height="4.500" rx="1"/>
  </g>
  <text x="160" y="251" font-size="13" font-weight="700" fill="#fff">Host &amp; Settings</text>
  <g class="icon" stroke-width="1.4">
    <path d="M410.500 248.500l-1 1a2.300 2.300 0 0 0 3.200 3.200l1.400-1.400"/>
    <path d="M413 247.500l1-1a2.300 2.300 0 0 0-3.200-3.200l-1.400 1.400"/>
  </g>
  <text x="426" y="251" font-size="13" font-weight="700" fill="#64748b">Connection URL</text>

  <!-- Host / Port -->
  <text x="63" y="304" class="label">HOST</text>
  <text x="470" y="304" class="label">PORT</text>
  <rect x="63.500" y="313.500" width="394" height="39" rx="6" class="input"/>
  <text x="76" y="338" class="val">localhost</text>
  <rect x="470.500" y="313.500" width="130" height="39" rx="6" class="input"/>
  <text x="483" y="338" class="val">5432</text>

  <!-- Database / Schema -->
  <text x="63" y="388" class="label">DATABASE</text>
  <text x="338" y="388" class="label">SCHEMA</text>
  <rect x="63.500" y="397.500" width="262" height="39" rx="6" class="input"/>
  <text x="76" y="422" class="ph">my_database</text>
  <rect x="338.500" y="397.500" width="262" height="39" rx="6" class="input"/>
  <text x="351" y="422" class="val">public</text>

  <!-- Username / Password -->
  <text x="63" y="472" class="label">USERNAME</text>
  <text x="338" y="472" class="label">PASSWORD</text>
  <rect x="63.500" y="481.500" width="262" height="39" rx="6" class="input"/>
  <text x="76" y="506" class="val">postgres</text>
  <rect x="338.500" y="481.500" width="262" height="39" rx="6" class="input"/>
  <g fill="#94a3b8"><circle cx="353" cy="501" r="1.800"/><circle cx="359" cy="501" r="1.800"/><circle cx="365" cy="501" r="1.800"/><circle cx="371" cy="501" r="1.800"/><circle cx="377" cy="501" r="1.800"/><circle cx="383" cy="501" r="1.800"/><circle cx="389" cy="501" r="1.800"/><circle cx="395" cy="501" r="1.800"/></g>
  <g class="icon" stroke-width="1.3">
    <path d="M573 501c2-3.500 5-5 7-5s5 1.500 7 5c-2 3.500-5 5-7 5s-5-1.500-7-5z"/>
    <circle cx="580" cy="501" r="1.600"/>
  </g>

  <!-- Connection string -->
  <rect x="63.500" y="547.500" width="537" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="567" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">GENERATED CONNECTION STRING:</text>
  <text x="76" y="584" font-size="11.500" fill="#2563eb" font-family="'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace" xml:space="preserve">postgresql://postgres@localhost:5432/?schemas=public</text>

  <!-- Footer -->
  <line x1="42" y1="618.500" x2="622" y2="618.500" stroke="#e2e8f0"/>
  <rect x="345.500" y="635.500" width="83" height="39" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="387" y="660" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Cancel</text>
  <rect x="439" y="635" width="162" height="40" rx="6" fill="#afc8e6"/>
  <g class="icon" stroke="#fff" stroke-width="1.500">
    <path d="M466 656a5 5 0 1 0 1.500-3.500"/>
    <path d="M466 650v3.500h3.500"/>
  </g>
  <text x="481" y="660" font-size="13" font-weight="700" fill="#fff">Generate DBML</text>
</svg>

