<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1025 595" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 1 L10 6 L2 11" fill="none" stroke="#8a9bb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- icons (24x24 grid scaled down when used) -->
    <symbol id="ico-table" viewBox="0 0 16 16">
      <rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="#fff" stroke-width="1.4"/>
      <path d="M1.5 6h13M1.5 9.5h13M6 6v7.5" stroke="#fff" stroke-width="1.2" fill="none"/>
      <rect x="1.5" y="2.5" width="13" height="3.5" fill="#fff"/>
    </symbol>

    <symbol id="ico-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11.5" fill="#fff"/>
      <g fill="#3a7ab5" transform="translate(12 12)">
        <circle r="5.2" fill="none" stroke="#3a7ab5" stroke-width="2.6"/>
        <g id="teeth">
          <rect x="-1.5" y="-8.6" width="3" height="4" rx="0.6"/>
          <rect x="-1.5" y="4.6" width="3" height="4" rx="0.6"/>
          <rect x="-8.6" y="-1.5" width="4" height="3" rx="0.6"/>
          <rect x="4.6" y="-1.5" width="4" height="3" rx="0.6"/>
        </g>
        <use href="#teeth" transform="rotate(45)"/>
        <circle r="2" fill="#fff"/>
      </g>
    </symbol>

    <symbol id="ico-key" viewBox="0 0 16 16">
      <circle cx="5" cy="5" r="3.4" fill="#f5b400" stroke="#3b2a00" stroke-width="1"/>
      <circle cx="4.2" cy="4.2" r="1" fill="#fff6d0"/>
      <path d="M7.4 7.4 L14 14 M11 11 l1.8 -1.8 M12.6 12.6 l1.6 -1.6" stroke="#3b2a00" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M7.4 7.4 L14 14 M11 11 l1.8 -1.8 M12.6 12.6 l1.6 -1.6" stroke="#f5b400" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </symbol>

    <symbol id="ico-fk" viewBox="0 0 16 16">
      <g fill="none" stroke="#1f2d3d" stroke-width="1.6" stroke-linecap="round">
        <rect x="1.2" y="6" width="8" height="4.6" rx="2.3" transform="rotate(-40 5.2 8.3)"/>
        <rect x="6.8" y="5.4" width="8" height="4.6" rx="2.3" transform="rotate(-40 10.8 7.7)"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="0.6" stroke-linecap="round" opacity="0.7">
        <rect x="1.2" y="6" width="8" height="4.6" rx="2.3" transform="rotate(-40 5.2 8.3)"/>
      </g>
    </symbol>

    <symbol id="ico-unique" viewBox="0 0 16 16">
      <path d="M8 1 L15 8 L8 15 L1 8 Z" fill="#12a5d8" stroke="#0a4f6b" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="8" cy="8" r="2.2" fill="#e8f8ff" stroke="#0a4f6b" stroke-width="1"/>
    </symbol>

    <!-- grip dots for note header -->
    <symbol id="ico-grip" viewBox="0 0 8 12">
      <g fill="none" stroke="#8a7a3a" stroke-width="1.1" stroke-linecap="round">
        <circle cx="2" cy="2" r="0.9"/><circle cx="6" cy="2" r="0.9"/>
        <circle cx="2" cy="6" r="0.9"/><circle cx="6" cy="6" r="0.9"/>
        <circle cx="2" cy="10" r="0.9"/><circle cx="6" cy="10" r="0.9"/>
      </g>
    </symbol>
  </defs>

  <!-- ================= RELATIONSHIP LINES ================= -->
  <g fill="none" stroke="#8a9bb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- users -> refresh_tokens (1 : *) -->
    <path d="M353 284 H371 Q383 284 383 272 V136 Q383 124 395 124 H413" marker-end="url(#arrow)"/>
    <!-- users -> jobs (1 : *) -->
    <path d="M353 284 H418 Q430 284 430 296 V324 Q430 336 442 336 H483" marker-end="url(#arrow)"/>
  </g>
  <g font-size="14" font-weight="700" fill="#5d6b7d">
    <text x="361" y="277">1</text>
    <text x="395" y="121" font-size="18">*</text>
    <text x="465" y="331" font-size="18">*</text>
  </g>

  <!-- ================= TABLE: refresh_tokens ================= -->
  <g filter="url(#shadow)">
    <rect x="413" y="45" width="220" height="155" rx="3" fill="#f3f5f9"/>
  </g>
  <path d="M413 78 V48 a3 3 0 0 1 3 -3 H630 a3 3 0 0 1 3 3 V78 Z" fill="#3479b7"/>
  <use href="#ico-table" x="424" y="54" width="14" height="14"/>
  <text x="443" y="67" font-size="13.5" font-weight="700" fill="#fff">refresh_tokens</text>
  <use href="#ico-gear" x="605" y="53" width="18" height="18"/>

  <g stroke="#dfe4ec" stroke-width="1">
    <path d="M413 109 H633 M413 139 H633 M413 169 H633"/>
  </g>
  <g font-size="13.5" fill="#1d2733">
    <use href="#ico-key" x="424" y="86" width="16" height="16"/>
    <text x="445" y="99">id</text>
    <use href="#ico-fk" x="424" y="116" width="16" height="16"/>
    <text x="445" y="129">user_id</text>
    <text x="424" y="159">token</text>
    <text x="424" y="189">expires_at</text>
  </g>
  <g font-size="12.5" fill="#7b8797" text-anchor="end">
    <text x="621" y="99">int</text>
    <text x="621" y="129">int</text>
    <text x="621" y="159">text</text>
    <text x="621" y="189">timestamp</text>
  </g>

  <!-- ================= TABLE: users ================= -->
  <g filter="url(#shadow)">
    <rect x="133" y="236" width="220" height="123" rx="3" fill="#f3f5f9"/>
  </g>
  <path d="M133 268 V239 a3 3 0 0 1 3 -3 H350 a3 3 0 0 1 3 3 V268 Z" fill="#3479b7"/>
  <use href="#ico-table" x="144" y="244" width="14" height="14"/>
  <text x="163" y="257" font-size="13.5" font-weight="700" fill="#fff">users</text>
  <use href="#ico-gear" x="325" y="243" width="18" height="18"/>

  <g stroke="#dfe4ec" stroke-width="1">
    <path d="M133 299 H353 M133 329 H353"/>
  </g>
  <g font-size="13.5" fill="#1d2733">
    <use href="#ico-key" x="144" y="276" width="16" height="16"/>
    <text x="165" y="289">id</text>
    <use href="#ico-unique" x="144" y="306" width="16" height="16"/>
    <text x="165" y="319">username</text>
    <text x="144" y="349">password</text>
  </g>
  <g font-size="12.5" fill="#7b8797" text-anchor="end">
    <text x="341" y="289">int</text>
    <text x="341" y="319">varchar</text>
    <text x="341" y="349">varchar</text>
  </g>

  <!-- ================= TABLE: jobs ================= -->
  <g filter="url(#shadow)">
    <rect x="483" y="258" width="220" height="154" rx="3" fill="#f3f5f9"/>
  </g>
  <path d="M483 290 V261 a3 3 0 0 1 3 -3 H700 a3 3 0 0 1 3 3 V290 Z" fill="#3479b7"/>
  <use href="#ico-table" x="494" y="266" width="14" height="14"/>
  <text x="513" y="279" font-size="13.5" font-weight="700" fill="#fff">jobs</text>
  <use href="#ico-gear" x="675" y="265" width="18" height="18"/>

  <g stroke="#dfe4ec" stroke-width="1">
    <path d="M483 321 H703 M483 351 H703 M483 381 H703"/>
  </g>
  <g font-size="13.5" fill="#1d2733">
    <use href="#ico-key" x="494" y="298" width="16" height="16"/>
    <text x="515" y="311">id</text>
    <use href="#ico-fk" x="494" y="328" width="16" height="16"/>
    <text x="515" y="341">user_id</text>
    <text x="494" y="371">job_name</text>
    <text x="494" y="401">schedule</text>
  </g>
  <g font-size="12.5" fill="#7b8797" text-anchor="end">
    <text x="691" y="311">int</text>
    <text x="691" y="341">int</text>
    <text x="691" y="371">varchar</text>
    <text x="691" y="401">varchar</text>
  </g>

  <!-- ================= NOTE: refresh_token_notes ================= -->
  <g filter="url(#shadow)">
    <rect x="650" y="62" width="180" height="180" rx="4" fill="#ffe08a"/>
  </g>
  <path d="M650 87 V66 a4 4 0 0 1 4 -4 H826 a4 4 0 0 1 4 4 V87 Z" fill="#e8ce7c"/>
  <use href="#ico-grip" x="657" y="69" width="6" height="12"/>
  <text x="672" y="79" font-size="11" font-weight="600" fill="#3b3520">refresh_token_n...</text>
  <g fill="#3b3520">
    <circle cx="814" cy="68" r="1.5"/><circle cx="814" cy="74" r="1.5"/><circle cx="814" cy="80" r="1.5"/>
  </g>
  <g font-size="12.5" fill="#2b2716">
    <text x="658" y="108">Stores refresh tokens used to</text>
    <text x="658" y="125">generate new access tokens.</text>
  </g>

  <!-- ================= NOTE: users_notes ================= -->
  <g filter="url(#shadow)">
    <rect x="204" y="374" width="180" height="180" rx="4" fill="#ffe08a"/>
  </g>
  <path d="M204 399 V378 a4 4 0 0 1 4 -4 H380 a4 4 0 0 1 4 4 V399 Z" fill="#e8ce7c"/>
  <use href="#ico-grip" x="211" y="381" width="6" height="12"/>
  <text x="226" y="391" font-size="11" font-weight="600" fill="#3b3520">users_notes</text>
  <g fill="#3b3520">
    <circle cx="368" cy="380" r="1.5"/><circle cx="368" cy="386" r="1.5"/><circle cx="368" cy="392" r="1.5"/>
  </g>
  <g font-size="12.5" fill="#2b2716">
    <text x="212" y="420">Stores registered users.</text>
    <text x="212" y="437">Password is stored as a bcrypt</text>
    <text x="212" y="454">hash</text>
  </g>
</svg>
