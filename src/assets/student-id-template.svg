<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 1400" width="714" height="1400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f9fd"/>
      <stop offset="1" stop-color="#cfe2fb"/>
    </linearGradient>
    <linearGradient id="idHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d63e0"/>
      <stop offset="1" stop-color="#0db8d8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#b9dff0" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e3a8a" flood-opacity="0.15"/>
    </filter>
    <clipPath id="canvas"><rect x="1" y="1" width="712" height="1398" rx="3"/></clipPath>
    <g id="sparkle">
      <path d="M0 -1 C0.6 -0.35 0.35 -0.6 1 0 C0.35 0.6 0.6 0.35 0 1 C-0.6 0.35 -0.35 0.6 -1 0 C-0.35 -0.6 -0.6 -0.35 0 -1Z"/>
    </g>
  </defs>

  <g clip-path="url(#canvas)">
    <!-- Background -->
    <rect width="714" height="1400" fill="url(#bg)"/>
    <rect width="714" height="1400" fill="url(#grid)"/>

    <g transform="translate(0, 547)">
<!-- Decorative circles -->
    <circle cx="715" cy="240" r="148" fill="#b9e3fa" opacity="0.85"/>
    <circle cx="690" cy="425" r="95" fill="#f3f0b8" opacity="0.55"/>
    <circle cx="-5" cy="470" r="145" fill="#ffffff" opacity="0.45"/>

    <!-- Illustration -->
    <circle cx="265" cy="725" r="176" fill="none" stroke="#a6d3f3" stroke-width="1.500"/>
    <circle cx="281" cy="835" r="160" fill="#ffd23f"/>

    <!-- Student ID card -->
    <g filter="url(#shadow)">
      <rect x="142" y="570" width="280" height="205" rx="14" fill="#ffffff"/>
    </g>
    <path d="M142 622 V584 a14 14 0 0 1 14 -14 H408 a14 14 0 0 1 14 14 V622Z" fill="url(#idHead)"/>
    <text x="165" y="601" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2.200">STUDENT ID</text>
    <circle cx="376" cy="595" r="12" fill="#ffffff" opacity="0.35"/>
    <circle cx="393" cy="595" r="12" fill="#ffffff" opacity="0.35"/>

    <rect x="165" y="640" width="70" height="70" rx="12" fill="#dbe8ff"/>
    <circle cx="200" cy="661" r="13" fill="#3b82f6"/>
    <path d="M178 710 C178 692 189 684 200 684 C211 684 222 692 222 710Z" fill="#3b82f6"/>

    <rect x="251" y="644" width="131" height="12" rx="6" fill="#2d3748"/>
    <rect x="251" y="668" width="98" height="9" rx="4.500" fill="#cbd5e1"/>
    <rect x="251" y="687" width="117" height="9" rx="4.500" fill="#e2e8f0"/>

    <rect x="165" y="724" width="234" height="34" rx="17" fill="#e6f6ee"/>
    <circle cx="186" cy="741" r="11" fill="#10b981"/>
    <path d="M181 741 L185 745 L192 737" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="207" y="746" font-size="14.500" font-weight="700" fill="#0f9d6a">Verified student</text>

    <!-- College email pill -->
    <g filter="url(#shadowSm)">
      <rect x="18" y="670" width="146" height="44" rx="22" fill="#ffffff"/>
    </g>
    <circle cx="41" cy="692" r="11" fill="#e0ecff"/>
    <rect x="35" y="688" width="12" height="9" rx="1.500" fill="#2563eb"/>
    <path d="M35.500 689 L41 693.500 L46.500 689" fill="none" stroke="#fff" stroke-width="1.100"/>
    <text x="59" y="697" font-size="14.500" font-weight="500" fill="#0f172a">College email</text>

    <!-- ID checked pill -->
    <g filter="url(#shadowSm)">
      <rect x="410" y="740" width="136" height="44" rx="22" fill="#ffffff"/>
    </g>
    <circle cx="433" cy="762" r="11" fill="#10b981"/>
    <path d="M428 762 L432 766 L439 758" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="451" y="767" font-size="14.500" font-weight="500" fill="#0f172a">ID checked</text>

    <!-- Dots -->
    <circle cx="156" cy="537" r="4.500" fill="#fb7185"/>
    <circle cx="41" cy="607" r="5" fill="#fb7185"/>
    <circle cx="503" cy="532" r="5" fill="#fbbf24"/>
    <circle cx="529" cy="583" r="6" fill="#14b8a6"/>

    <!-- Sparkles -->
    <use href="#sparkle" transform="translate(517,696) scale(17)" fill="#4aa3e8"/>
    <use href="#sparkle" transform="translate(46,783) scale(12)" fill="#4aa3e8"/>
  </g>

  </g>
  <!-- Outer border -->
  <rect x="0.500" y="0.500" width="713" height="1399" rx="3" fill="none" stroke="#d5dde6"/>
</svg>
