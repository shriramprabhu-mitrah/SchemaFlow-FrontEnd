<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 -30 618 727" width="618" height="727" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Connect to a Database dialog" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="modalShadow" x="-20%" y="-10%" width="140%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <style>
      text { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
      .mono { font-family: "Liberation Mono", "Courier New", Courier, monospace; }
      .label { font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.7px; }
      .input { fill: #fff; stroke: #d3dae4; stroke-width: 1; }
      .val { font-size: 12.500px; fill: #0f172a; }
      .ph { font-size: 12.500px; fill: #9aa5b5; }
      .icon { fill: none; stroke: #64748b; stroke-width: 1.400; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Modal -->
  <rect x="44" y="10" width="538" height="647" rx="14" fill="#fff" filter="url(#modalShadow)"/>

  <!-- Header -->
  <g class="icon" stroke="#475569" transform="translate(0 -22)">
    <path d="M70.500 62.500l-1.800 1.800a3.200 3.200 0 0 0 4.500 4.500l2-2"/>
    <path d="M73.500 65.500l1.800-1.800a3.200 3.200 0 0 0-4.500-4.500l-2 2"/>
    <path d="M70 66l4-4"/>
  </g>
  <text x="89" y="47" font-size="14.500" font-weight="700" fill="#111827">Connect to a Database</text>
  <path d="M549 37l8 8M557 37l-8 8" stroke="#475569" stroke-width="1.600" stroke-linecap="round" fill="none"/>
  <line x1="44" y1="71.500" x2="582" y2="71.500" stroke="#e5e7eb"/>

  <!-- Database type -->
  <text x="64" y="112" class="label">DATABASE TYPE</text>
  <rect x="62" y="119" width="503" height="43" rx="8" fill="none" stroke="#3b82f6" stroke-opacity="0.28" stroke-width="3"/>
  <rect x="64.500" y="121.500" width="498" height="38" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.200"/>
  <text x="77" y="145" class="val">MySQL</text>
  <path d="M541 138.500l4 4 4-4" class="icon" stroke="#94a3b8"/>

  <!-- Connect by -->
  <text x="64" y="194" class="label">CONNECT BY</text>
  <rect x="64.500" y="203.500" width="498" height="36" rx="8" fill="#eef2f7" stroke="#dbe3ee"/>
  <rect x="68" y="207" width="241" height="29" rx="6" fill="#3178b5"/>
  <g fill="none" stroke="#fff" stroke-width="1.400" stroke-linejoin="round">
    <rect x="135" y="215" width="11" height="5" rx="1.200"/>
    <rect x="135" y="222" width="11" height="5" rx="1.200"/>
  </g>
  <text x="153" y="225.500" font-size="12.500" font-weight="700" fill="#fff">Host &amp; Settings</text>
  <g class="icon" transform="translate(-24.500 -26)">
    <path d="M410.500 248.500l-1 1a2.300 2.300 0 0 0 3.200 3.200l1.400-1.400"/>
    <path d="M413 247.500l1-1a2.300 2.300 0 0 0-3.200-3.200l-1.400 1.400"/>
  </g>
  <text x="401" y="225.500" font-size="12.500" font-weight="700" fill="#64748b">Connection URL</text>

  <!-- Generated connection string -->
  <text x="64" y="274" class="label">GENERATED CONNECTION STRING</text>
  <rect x="64.500" y="284.500" width="498" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="318" font-size="11" class="mono" fill="#2563eb">mysql://root@example.com:3306/</text>

  <!-- Host / Port -->
  <text x="64" y="369" class="label">HOST</text>
  <text x="441" y="369" class="label">PORT</text>
  <rect x="64.500" y="378.500" width="365" height="36" rx="7" class="input"/>
  <text x="76" y="401" class="val">localhost</text>
  <rect x="441.500" y="378.500" width="121" height="36" rx="7" class="input"/>
  <text x="453" y="401" class="val">3306</text>

  <!-- Database -->
  <text x="64" y="447" class="label">DATABASE</text>
  <rect x="64.500" y="456.500" width="498" height="36" rx="7" class="input"/>
  <text x="76" y="479" class="ph">my_database</text>

  <!-- Username / Password -->
  <text x="64" y="525" class="label">USERNAME</text>
  <text x="319" y="525" class="label">PASSWORD</text>
  <rect x="64.500" y="534.500" width="243" height="36" rx="7" class="input"/>
  <text x="76" y="557" class="val">root</text>
  <rect x="319.500" y="534.500" width="243" height="36" rx="7" class="input"/>
  <g fill="#94a3b8">
    <circle cx="333" cy="552" r="1.500"/><circle cx="337.500" cy="552" r="1.500"/><circle cx="342" cy="552" r="1.500"/><circle cx="346.500" cy="552" r="1.500"/>
    <circle cx="351" cy="552" r="1.500"/><circle cx="355.500" cy="552" r="1.500"/><circle cx="360" cy="552" r="1.500"/><circle cx="364.500" cy="552" r="1.500"/>
  </g>
  <g class="icon" stroke="#94a3b8" stroke-width="1.200" transform="translate(-36 51)">
    <path d="M573 501c2-3.500 5-5 7-5s5 1.500 7 5c-2 3.500-5 5-7 5s-5-1.500-7-5z"/>
    <circle cx="580" cy="501" r="1.600"/>
  </g>

  <!-- Footer -->
  <line x1="44" y1="589.500" x2="582" y2="589.500" stroke="#e5e7eb"/>
  <rect x="325.500" y="605.500" width="78" height="36" rx="6" fill="#fff" stroke="#d3dae4"/>
  <text x="364.500" y="628" font-size="12.500" font-weight="700" fill="#334155" text-anchor="middle">Cancel</text>
  <rect x="413" y="605" width="150" height="37" rx="6" fill="#afc8e6"/>
  <g class="icon" stroke="#fff" stroke-width="1.400" transform="translate(-30 -29)">
    <path d="M466 656a5 5 0 1 0 1.500-3.500"/>
    <path d="M466 650v3.500h3.500"/>
  </g>
  <text x="452" y="628" font-size="12.500" font-weight="700" fill="#fff">Generate DBML</text>
</svg>
