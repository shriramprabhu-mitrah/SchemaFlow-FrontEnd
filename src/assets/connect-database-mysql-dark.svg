<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21 -33 642 760" width="642" height="760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Connect to a Database dialog (dark theme)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="modalShadow" x="-20%" y="-10%" width="140%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="tealGlow" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.500"/>
    </filter>
    <style>
      text { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
      .mono { font-family: "Liberation Mono", "Courier New", Courier, monospace; }
      .label { font-size: 11px; font-weight: 700; fill: #8b97ad; letter-spacing: 0.7px; }
      .input { fill: #070b14; stroke: #172033; stroke-width: 1; }
      .val { font-size: 13px; fill: #e5e7eb; }
      .ph { font-size: 12.500px; fill: #4b5568; }
      .icon { fill: none; stroke: #cbd5e1; stroke-width: 1.400; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Modal -->
  <rect x="19" y="7" width="562" height="680" rx="14" fill="#101827" filter="url(#modalShadow)"/>
  <rect x="19.500" y="7.500" width="561" height="679" rx="14" fill="none" stroke="#1f2a3d"/>

  <!-- Header -->
  <g class="icon" transform="translate(-25 -24)">
    <path d="M70.500 62.500l-1.800 1.800a3.200 3.200 0 0 0 4.500 4.500l2-2"/>
    <path d="M73.500 65.500l1.800-1.800a3.200 3.200 0 0 0-4.500-4.500l-2 2"/>
    <path d="M70 66l4-4"/>
  </g>
  <text x="66" y="45" font-size="14.500" font-weight="700" fill="#f1f5f9">Connect to a Database</text>
  <path d="M546 36l8 8M554 36l-8 8" stroke="#94a3b8" stroke-width="1.600" stroke-linecap="round" fill="none"/>
  <line x1="19" y1="71.500" x2="581" y2="71.500" stroke="#1f2a3d"/>

  <!-- Database type -->
  <text x="39" y="113" class="label">DATABASE TYPE</text>
  <rect x="39.500" y="122.500" width="520" height="39" rx="8" fill="#0b111d" stroke="#1f2a3d"/>
  <text x="53" y="147" font-size="14" fill="#f1f5f9">MySQL</text>
  <path d="M536 140.500l4 4 4-4" class="icon" stroke-width="1.300"/>

  <!-- Connect by -->
  <text x="39" y="198" class="label">CONNECT BY</text>
  <rect x="39.500" y="208.500" width="520" height="37" rx="8" fill="#0d1422" stroke="#1a2335"/>
  <g class="icon" stroke-width="1.300">
    <rect x="113" y="221" width="12" height="5" rx="1.200"/>
    <rect x="113" y="228" width="12" height="5" rx="1.200"/>
  </g>
  <text x="132" y="231.500" font-size="12.500" font-weight="700" fill="#cbd5e1">Host &amp; Settings</text>
  <rect x="304" y="214" width="251" height="30" rx="6" fill="#3cc9c3" opacity="0.45" filter="url(#tealGlow)"/>
  <rect x="304" y="212" width="251" height="30" rx="6" fill="#3cc9c3"/>
  <g class="icon" stroke="#0b1a22" stroke-width="1.400" transform="translate(-34.500 -21)">
    <path d="M410.500 248.500l-1 1a2.300 2.300 0 0 0 3.200 3.200l1.400-1.400"/>
    <path d="M413 247.500l1-1a2.300 2.300 0 0 0-3.200-3.200l-1.400 1.400"/>
  </g>
  <text x="391" y="231.500" font-size="12.500" font-weight="700" fill="#0b1a22">Connection URL</text>

  <!-- Connection URL -->
  <text x="39" y="282" class="label">CONNECTION URL</text>
  <rect x="38" y="291" width="522" height="52" rx="8" fill="none" stroke="#3cc9c3" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="39.500" y="292.500" width="520" height="49" rx="7" fill="#070b14" stroke="#3cc9c3" stroke-width="1.200"/>
  <text x="52" y="311" font-size="11.500" class="mono" fill="#f1f5f9">mysql://root@example.com:3306/</text>
  <line x1="259.500" y1="300" x2="259.500" y2="315" stroke="#f1f5f9" stroke-width="1.200"/>

  <!-- Host / Port -->
  <text x="39" y="381" class="label">HOST</text>
  <text x="433" y="381" class="label">PORT</text>
  <rect x="39.500" y="391.500" width="381" height="37" rx="7" class="input"/>
  <text x="52" y="415" class="val">localhost</text>
  <rect x="433.500" y="391.500" width="125" height="37" rx="7" class="input"/>
  <text x="446" y="415" class="val">3306</text>

  <!-- Database -->
  <text x="39" y="463" class="label">DATABASE</text>
  <rect x="39.500" y="472.500" width="520" height="37" rx="7" class="input"/>
  <text x="52" y="496" class="ph">my_database</text>

  <!-- Username / Password -->
  <text x="39" y="544" class="label">USERNAME</text>
  <text x="305" y="544" class="label">PASSWORD</text>
  <rect x="39.500" y="553.500" width="253" height="37" rx="7" class="input"/>
  <text x="52" y="577" class="val">root</text>
  <rect x="305.500" y="553.500" width="253" height="37" rx="7" class="input"/>
  <g fill="#5b6577">
    <circle cx="319" cy="573" r="1.500"/><circle cx="323.500" cy="573" r="1.500"/><circle cx="328" cy="573" r="1.500"/><circle cx="332.500" cy="573" r="1.500"/>
    <circle cx="337" cy="573" r="1.500"/><circle cx="341.500" cy="573" r="1.500"/><circle cx="346" cy="573" r="1.500"/><circle cx="350.500" cy="573" r="1.500"/>
  </g>
  <g class="icon" stroke-width="1.200" transform="translate(-40 72)">
    <path d="M573 501c2-3.500 5-5 7-5s5 1.500 7 5c-2 3.500-5 5-7 5s-5-1.500-7-5z"/>
    <circle cx="580" cy="501" r="1.600"/>
  </g>

  <!-- Footer -->
  <line x1="19" y1="612.500" x2="581" y2="612.500" stroke="#1f2a3d"/>
  <text x="353.500" y="652.500" font-size="12.500" font-weight="700" fill="#f1f5f9" text-anchor="middle">Cancel</text>
  <rect x="403" y="628" width="156" height="39" rx="6" fill="#1a2336"/>
  <g class="icon" stroke="#5b6577" stroke-width="1.400" transform="translate(-39 -5)">
    <path d="M466 656a5 5 0 1 0 1.500-3.500"/>
    <path d="M466 650v3.500h3.500"/>
  </g>
  <text x="444" y="652.500" font-size="12.500" font-weight="700" fill="#5b6577">Generate DBML</text>
</svg>
