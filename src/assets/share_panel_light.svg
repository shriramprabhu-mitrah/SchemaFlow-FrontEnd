<svg xmlns="http://www.w3.org/2000/svg" viewBox="167 31 640 401" width="640" height="401" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sharing dialog" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="modalShadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="btnGlow" x="-30%" y="-40%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b62ee"/>
      <stop offset="1" stop-color="#1d4fd8"/>
    </linearGradient>
    <clipPath id="linkClip"><rect x="239" y="244" width="456" height="32" rx="5"/></clipPath>
    <clipPath id="modalClip"><rect x="207" y="71" width="560" height="321" rx="12"/></clipPath>
    <style>
      text { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
      .mono { font-family: "Liberation Mono", "Courier New", Courier, monospace; }
      .lbl { font-size: 13.500px; fill: #4b5563; }
      .btnText { font-size: 12.500px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .field { fill: #fff; stroke: #cfd6e0; stroke-width: 1; }
    </style>
  </defs>

  <!-- Modal -->
  <rect x="207" y="71" width="560" height="321" rx="12" fill="#fff" filter="url(#modalShadow)"/>

  <!-- Header band (inset) -->
  <g clip-path="url(#modalClip)">
    <rect x="218" y="82" width="538" height="45" fill="#f8f9fb"/>
  </g>
  <line x1="218" y1="127.500" x2="756" y2="127.500" stroke="#e5e7eb"/>
  <text x="238" y="108" font-size="13.500" font-weight="700" fill="#111827">Sharing</text>
  <rect x="238" y="125" width="51" height="2" fill="#2563eb"/>
  <path d="M718.500 98.500l10 10M728.500 98.500l-10 10" stroke="#8a94a6" stroke-width="1.400" stroke-linecap="round" fill="none"/>

  <!-- Public Diagram + toggle -->
  <text x="238" y="169.500" font-size="13" font-weight="700" fill="#475569">Public Diagram</text>
  <rect x="345" y="156" width="34" height="18" rx="9" fill="#2563eb"/>
  <circle cx="370" cy="165" r="7" fill="#fff"/>

  <!-- Save Settings -->
  <rect x="624" y="148" width="112" height="34" rx="5" fill="url(#btnGrad)" filter="url(#btnGlow)"/>
  <text x="680" y="169" class="btnText">Save Settings</text>

  <!-- Share link -->
  <text x="238" y="229" class="lbl">Share this link with others</text>
  <rect x="238.500" y="243.500" width="457" height="33" rx="6" class="field"/>
  <g clip-path="url(#linkClip)">
    <text x="251" y="265" font-size="13" class="mono" fill="#111827" xml:space="preserve">https://your-domain.com/public-diagram/3bc962f7-ff4f-4576-</text>
  </g>
  <rect x="702" y="243" width="34" height="34" rx="6" fill="url(#btnGrad)" filter="url(#btnGlow)"/>
  <g fill="none" stroke="#fff" stroke-width="1.500" stroke-linejoin="round" stroke-linecap="round">
    <rect x="715.500" y="257" width="9" height="9" rx="1.500"/>
    <path d="M712.500 261v-6.500a1.500 1.500 0 0 1 1.500-1.500h6.500"/>
  </g>

  <!-- Send via email -->
  <text x="238" y="303" class="lbl">Send link via email</text>
  <rect x="238.500" y="317.500" width="418" height="33" rx="6" class="field"/>
  <text x="251" y="339" font-size="13" fill="#9ca3af">Email, comma or space separated</text>
  <rect x="671" y="317" width="65" height="34" rx="5" fill="#2563eb" opacity="0.5"/>
  <text x="703.500" y="338" class="btnText">Share</text>
</svg>
