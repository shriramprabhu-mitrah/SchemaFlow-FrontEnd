<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 -5 658 772" width="658" height="772" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Connect to a Database dialog (dark theme, PostgreSQL)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="modalShadow" x="-20%" y="-8%" width="140%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="tealGlow" x="-10%" y="-60%" width="120%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.500"/>
    </filter>
    <linearGradient id="modalBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121b2d"/>
      <stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <style>
      text { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
      .mono { font-family: "Liberation Mono", "Courier New", Courier, monospace; }
      .label { font-size: 11px; font-weight: 700; fill: #9aa7bd; letter-spacing: 0.6px; }
      .req { fill: #ef4444; font-weight: 700; }
      .opt { font-size: 10px; font-weight: 400; fill: #7b879b; letter-spacing: 0; }
      .input { fill: #070b14; stroke: #172033; stroke-width: 1; }
      .val { font-size: 13.500px; fill: #e5e7eb; }
      .ph { font-size: 13px; fill: #4b5568; }
      .icon { fill: none; stroke: #cbd5e1; stroke-width: 1.400; stroke-linecap: round; stroke-linejoin: round; }
      .dis { fill: #0d1422; stroke: #1f2a3d; stroke-width: 1; }
    </style>
  </defs>

  <!-- Modal -->
  <rect x="48" y="35" width="578" height="692" rx="14" fill="url(#modalBg)" filter="url(#modalShadow)"/>
  <rect x="48.500" y="35.500" width="577" height="691" rx="14" fill="none" stroke="#1f2a3d"/>

  <!-- Header -->
  <g class="icon" transform="translate(5 4)">
    <path d="M70.500 62.500l-1.800 1.800a3.200 3.200 0 0 0 4.500 4.500l2-2"/>
    <path d="M73.500 65.500l1.800-1.800a3.200 3.200 0 0 0-4.500-4.500l-2 2"/>
    <path d="M70 66l4-4"/>
  </g>
  <text x="96" y="73" font-size="15" font-weight="700" fill="#f1f5f9">Connect to a Database</text>
  <path d="M592 64l8 8M600 64l-8 8" stroke="#cbd5e1" stroke-width="1.700" stroke-linecap="round" fill="none"/>
  <line x1="48" y1="100.500" x2="626" y2="100.500" stroke="#1f2a3d"/>

  <g transform="translate(0 -64)">
  <!-- Database type -->
  <text x="68" y="206" class="label">DATABASE TYPE</text>
  <rect x="68.500" y="215.500" width="537" height="40" rx="8" fill="#0a0f1a" stroke="#1f2a3d"/>
  <text x="83" y="240" font-size="13.500" fill="#f1f5f9">PostgreSQL</text>
  <path d="M581 234.500l4 4 4-4" class="icon" stroke-width="1.300"/>

  <!-- Connect by -->
  <text x="68" y="294" class="label">CONNECT BY</text>
  <rect x="68.500" y="303.500" width="537" height="40" rx="8" fill="#0a0f1a" stroke="#1a2335"/>
  <rect x="73" y="310" width="259" height="31" rx="6" fill="#3cc9c3" opacity="0.45" filter="url(#tealGlow)"/>
  <rect x="73" y="308" width="259" height="31" rx="6" fill="#3cc9c3"/>
  <g fill="none" stroke="#0b1a22" stroke-width="1.400" stroke-linejoin="round">
    <rect x="145" y="317" width="12" height="5" rx="1.200"/>
    <rect x="145" y="324" width="12" height="5" rx="1.200"/>
  </g>
  <text x="165" y="328" font-size="13" font-weight="700" fill="#0b1a22">Host &amp; Settings</text>
  <g class="icon" stroke="#aab4c5" transform="translate(5.500 75)">
    <path d="M410.500 248.500l-1 1a2.300 2.300 0 0 0 3.200 3.200l1.400-1.400"/>
    <path d="M413 247.500l1-1a2.300 2.300 0 0 0-3.200-3.200l-1.400 1.400"/>
  </g>
  <text x="431" y="328" font-size="13" font-weight="700" fill="#aab4c5">Connection URL</text>

  <!-- Generated connection string -->
  <text x="68" y="381" class="label">GENERATED CONNECTION STRING</text>
  <rect x="68.500" y="390.500" width="537" height="73" rx="8" fill="#0a0f1a" stroke="#1f2a3d"/>
  <text x="81" y="429" font-size="12" class="mono" fill="#3cc9c3">postgresql://postgres@example.com:5432/</text>

  <!-- Host / Port -->
  <text x="68" y="483" class="label">HOST<tspan class="req" dx="5">*</tspan></text>
  <text x="475" y="483" class="label">PORT<tspan class="req" dx="5">*</tspan></text>
  <rect x="68.500" y="492.500" width="393" height="39" rx="7" class="input"/>
  <text x="81" y="516" class="val">localhost</text>
  <rect x="475.500" y="492.500" width="129" height="39" rx="7" class="input"/>
  <text x="488" y="516" class="val">5432</text>

  <!-- Database / Schema -->
  <text x="68" y="567" class="label">DATABASE<tspan class="req" dx="5">*</tspan></text>
  <text x="343" y="567" class="label">SCHEMA<tspan class="opt" dx="5">(optional)</tspan></text>
  <rect x="68.500" y="576.500" width="262" height="39" rx="7" class="input"/>
  <text x="81" y="600" class="ph">my_database</text>
  <rect x="343.500" y="576.500" width="262" height="39" rx="7" class="input"/>
  <text x="356" y="600" class="ph">e.g. public (optional)</text>

  <!-- Username / Password -->
  <text x="68" y="651" class="label">USERNAME<tspan class="req" dx="5">*</tspan></text>
  <text x="343" y="651" class="label">PASSWORD<tspan class="req" dx="5">*</tspan></text>
  <rect x="68.500" y="660.500" width="262" height="39" rx="7" class="input"/>
  <text x="81" y="684" class="val">postgres</text>
  <rect x="343.500" y="660.500" width="262" height="39" rx="7" class="input"/>
  <g fill="#5b6577">
    <circle cx="357" cy="679" r="1.500"/><circle cx="361.500" cy="679" r="1.500"/><circle cx="366" cy="679" r="1.500"/><circle cx="370.500" cy="679" r="1.500"/>
    <circle cx="375" cy="679" r="1.500"/><circle cx="379.500" cy="679" r="1.500"/><circle cx="384" cy="679" r="1.500"/><circle cx="388.500" cy="679" r="1.500"/>
  </g>
  <g class="icon" stroke-width="1.200" transform="translate(4 179)">
    <path d="M573 501c2-3.500 5-5 7-5s5 1.500 7 5c-2 3.500-5 5-7 5s-5-1.500-7-5z"/>
    <circle cx="580" cy="501" r="1.600"/>
  </g>

  <!-- Footer -->
  <line x1="48" y1="720.500" x2="626" y2="720.500" stroke="#1f2a3d"/>
  <rect x="68.500" y="737.500" width="138" height="37" rx="6" class="dis"/>
  <text x="137.500" y="760.500" font-size="12" font-weight="700" fill="#4b5568" text-anchor="middle">Test Connection</text>
  <text x="411" y="760.500" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Cancel</text>
  <rect x="460.500" y="737.500" width="144" height="37" rx="6" class="dis"/>
  <g class="icon" stroke="#5b6577" stroke-width="1.400" transform="translate(15 103)">
    <path d="M466 656a5 5 0 1 0 1.500-3.500"/>
    <path d="M466 650v3.500h3.500"/>
  </g>
  <text x="497.500" y="760.500" font-size="12" font-weight="700" fill="#5b6577">Generate DBML</text>
  </g>
</svg>
